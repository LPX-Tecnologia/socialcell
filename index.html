<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialCell Bots - Twitch Multi-Bot</title>

    <!-- Bibliotecas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/tmi.min.js"></script>

    <style>
        /* RESET E BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(0,255,255,0.03) 0%, transparent 50%);
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px 25px;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 255, 0.2);
            margin-bottom: 30px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.05);
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            -webkit-text-fill-color: initial;
            color: #ff00ff;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
        }

        .stats span {
            color: #00ffff;
            font-weight: 700;
        }

        .btn {
            padding: 8px 18px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn-purple {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-purple:hover {
            background: #ff00ff;
            color: #0a0a0a;
        }

        .btn-green {
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-green:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        .btn-danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        .btn-danger:hover {
            background: #ff4444;
            color: #0a0a0a;
        }

        /* CONTAINER DOS CARDS (celulares) */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: flex-start;
            align-items: stretch;
        }

        /* CARD (celular) */
        .card {
            flex: 0 0 calc(25% - 25px);
            min-width: 280px;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 25px;
            padding: 18px;
            border: 2px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.05);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: fadeInUp 0.5s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.15);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, transparent, #ff00ff, transparent);
            background-size: 400% 400%;
            border-radius: 27px;
            z-index: -1;
            animation: neonCard 4s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover::before {
            opacity: 0.5;
        }

        @keyframes neonCard {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Cabeçalho do card */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-name {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: #00ffff;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-name .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
            color: #0a0a0a;
        }

        .card-status {
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: #333;
            color: #aaa;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .card-status.online {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border-color: #00ff88;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .card-status.offline {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border-color: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .card-info {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-info .channel {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .card-info .channel i {
            color: #00ffff;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .card-actions button {
            flex: 1;
            min-width: 60px;
            padding: 8px 10px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .card-actions button:hover {
            background: #00ffff;
            color: #0a0a0a;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .card-actions .btn-toggle {
            border-color: #ffaa00;
            color: #ffaa00;
        }

        .card-actions .btn-toggle:hover {
            background: #ffaa00;
            color: #0a0a0a;
        }

        .card-actions .btn-toggle.active {
            background: #00ff88;
            color: #0a0a0a;
            border-color: #00ff88;
        }

        .card-actions .btn-remove {
            border-color: #ff4444;
            color: #ff4444;
            flex: 0.5;
        }

        .card-actions .btn-remove:hover {
            background: #ff4444;
            color: #0a0a0a;
        }

        .card-log {
            margin-top: 10px;
            background: #0a0a0a;
            border-radius: 8px;
            padding: 6px 10px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
            color: #666;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-log .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .card-log .log-entry.system {
            color: #66ccff;
        }
        .card-log .log-entry.response {
            color: #00ff88;
        }
        .card-log .log-entry.spontaneous {
            color: #ffaa00;
        }
        .card-log .log-entry.error {
            color: #ff4444;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(0, 255, 255, 0.2);
            animation: modalSlide 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalSlide {
            from { transform: translateY(-30px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-content h2 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-content .form-group {
            margin-bottom: 15px;
        }

        .modal-content label {
            display: block;
            color: #888;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            background: #0a0a0a;
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }

        .modal-content input:focus, .modal-content select:focus {
            outline: none;
            border-color: #00ffff;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .modal-buttons button:hover {
            background: #00ffff;
            color: #0a0a0a;
        }

        .modal-close {
            border-color: #ff4444 !important;
            color: #ff4444 !important;
        }

        .modal-close:hover {
            background: #ff4444 !important;
            color: #fff !important;
        }

        /* NOTIFICAÇÕES */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffff;
            border-radius: 10px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.4s ease, fadeOut 0.4s ease 3s forwards;
            max-width: 350px;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(50px); }
        }

        /* RESPONSIVIDADE */
        @media (max-width: 1200px) {
            .card { flex: 0 0 calc(33.33% - 25px); }
        }
        @media (max-width: 900px) {
            .card { flex: 0 0 calc(50% - 25px); }
        }
        @media (max-width: 600px) {
            .card { flex: 0 0 100%; }
            .header { flex-direction: column; align-items: stretch; }
            .header-controls { justify-content: center; }
            .stats { justify-content: center; }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00ffff, #ff00ff); border-radius: 10px; }

        /* EMPTY STATE */
        .empty-state {
            width: 100%;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state i { font-size: 4rem; color: #333; margin-bottom: 20px; }
        .empty-state h3 { font-family: 'Orbitron', monospace; color: #444; }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-robot"></i> SocialCell Bots
            <span style="font-size: 0.6rem; -webkit-text-fill-color: #666; font-weight: 400;">Multi-Bot Twitch</span>
        </div>
        <div class="header-controls">
            <div class="stats">
                <div><i class="fas fa-users" style="color: #00ffff;"></i> Bots: <span id="totalBots">0</span></div>
                <div><i class="fas fa-check-circle" style="color: #00ff88;"></i> Online: <span id="onlineBots">0</span></div>
            </div>
            <button class="btn" onclick="abrirModal()"><i class="fas fa-plus-circle"></i> Novo Bot</button>
            <button class="btn btn-purple" onclick="adicionarBotsExemplo(3)"><i class="fas fa-layer-group"></i> +3 Exemplo</button>
            <button class="btn btn-green" onclick="ativarTodos()"><i class="fas fa-play"></i> Ativar Tudo</button>
            <button class="btn btn-danger" onclick="desativarTodos()"><i class="fas fa-stop"></i> Desativar Tudo</button>
        </div>
    </header>

    <!-- ===== CONTAINER DOS CARDS ===== -->
    <div class="cards-container" id="cardsContainer">
        <!-- Cards serão inseridos aqui -->
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2><i class="fas fa-robot" style="color: #ff00ff;"></i> Novo Bot</h2>
            <form id="formNovoBot">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nome do Bot</label>
                    <input type="text" id="botName" placeholder="Ex: Botzinho01" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-hashtag"></i> Canal (sem #)</label>
                    <input type="text" id="botChannel" placeholder="canal_da_live" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-palette"></i> Cor do Avatar</label>
                    <input type="color" id="botColor" value="#00ffff">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key"></i> Token OAuth (opcional)</label>
                    <input type="password" id="botToken" placeholder="oauth:... (deixe em branco para usar o token padrão)">
                    <small style="color: #666; font-size: 0.7rem;">Se deixar em branco, usará o token salvo nas configurações.</small>
                </div>
                <div class="modal-buttons">
                    <button type="submit"><i class="fas fa-check"></i> Criar</button>
                    <button type="button" class="modal-close" onclick="fecharModal()"><i class="fas fa-times"></i></button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== CONFIGURAÇÕES GLOBAIS (escondido) ===== -->
    <div style="display: none;">
        <input type="text" id="globalToken" value="oauth:seu_token_aqui">
        <input type="text" id="openaiKey" value="sua_chave_openai">
    </div>

    <script>
        // ================================================================
        // CONFIGURAÇÕES GLOBAIS
        // ================================================================
        // Pegue seus tokens do .env ou defina aqui
        const GLOBAL_TOKEN = 'oauth:seu_token_aqui'; // Substitua pelo seu token
        const OPENAI_API_KEY = 'sua_chave_openai';   // Substitua pela sua chave

        // Se não tiver chave OpenAI, usaremos respostas simuladas
        const USE_OPENAI = OPENAI_API_KEY !== 'sua_chave_openai' && OPENAI_API_KEY.length > 10;

        // ================================================================
        // ESTADO
        // ================================================================
        let bots = [];
        let botCounter = 0;
        let clients = {}; // { botId: tmi.Client }
        let onlineCount = 0;

        // ================================================================
        // FUNÇÕES DE IA (OpenAI ou simulada)
        // ================================================================
        async function gerarRespostaIA(mensagem, usuario, botName, historico = []) {
            if (USE_OPENAI) {
                try {
                    const response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${OPENAI_API_KEY}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-4o-mini',
                            messages: [
                                { role: 'system', content: `Você é um espectador humano em uma live da Twitch. Seu nome é ${botName}. Interaja de forma natural, engraçada, use gírias e emotes (POGGERS, KEKW, LUL). Respostas curtas (1-2 frases). Não fale sobre política.` },
                                ...historico.slice(-5).map(h => ({ role: 'user', content: h })),
                                { role: 'user', content: mensagem }
                            ],
                            max_tokens: 70,
                            temperature: 0.85
                        })
                    });
                    const data = await response.json();
                    let resposta = data.choices[0].message.content.trim();
                    if (Math.random() < 0.2) {
                        const emotes = ['POGGERS', 'KEKW', 'LUL', 'OMEGALUL', 'monkaS'];
                        resposta += ` ${emotes[Math.floor(Math.random() * emotes.length)]}`;
                    }
                    return resposta;
                } catch (e) {
                    console.error('Erro OpenAI:', e);
                    return null;
                }
            } else {
                // Simulação (sem OpenAI)
                const respostas = [
                    "hahaha verdade! 😂",
                    "nossa, concordo plenamente!",
                    "isso foi épico demais! 🔥",
                    "alguém mais tá amando essa live?",
                    "que jogada insana!",
                    "eu também tô achando incrível!",
                    "melhor momento da live com certeza",
                    "hahaha que isso cara",
                    "pois é, tô curtindo muito",
                    "alguém mais viu isso? 👀"
                ];
                await new Promise(r => setTimeout(r, 800 + Math.random() * 1200));
                return respostas[Math.floor(Math.random() * respostas.length)];
            }
        }

        // ================================================================
        // GERENCIAMENTO DE BOTS
        // ================================================================

        function criarBot(dados) {
            const id = ++botCounter;
            const bot = {
                id: id,
                nome: dados.nome || `Bot${id}`,
                canal: dados.canal || 'canal_teste',
                cor: dados.cor || '#00ffff',
                token: dados.token || GLOBAL_TOKEN,
                ativo: false,
                client: null,
                historico: {},
                cooldowns: {},
                ultimaResposta: 0,
                log: []
            };
            bots.push(bot);
            renderizarBot(bot);
            atualizarStats();
            notificar(`🤖 Bot "${bot.nome}" criado!`);
            return bot;
        }

        function renderizarBot(bot) {
            const container = document.getElementById('cardsContainer');
            // Remove empty state se existir
            const empty = container.querySelector('.empty-state');
            if (empty) empty.remove();

            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.botId = bot.id;
            card.id = `card-${bot.id}`;

            const initials = bot.nome.split(' ').map(w => w[0]).join('').toUpperCase().substring(0, 2);

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-name">
                        <span class="avatar" style="background: ${bot.cor};">${initials}</span>
                        ${bot.nome}
                    </div>
                    <span class="card-status offline" id="status-${bot.id}">🔴 Offline</span>
                </div>
                <div class="card-info">
                    <div class="channel"><i class="fas fa-hashtag"></i> ${bot.canal}</div>
                    <div style="display: flex; gap: 8px; font-size: 0.65rem; color: #666;">
                        <span><i class="fas fa-key"></i> Token: ${bot.token ? '●●●●' : '❌'}</span>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="btn-toggle" id="toggle-${bot.id}" onclick="toggleBot(${bot.id})">
                        <i class="fas fa-power-off"></i> Ativar
                    </button>
                    <button class="btn-remove" onclick="removerBot(${bot.id})">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
                <div class="card-log" id="log-${bot.id}">
                    <div class="log-entry system">🟢 Bot criado. Aguardando ativação...</div>
                </div>
            `;

            container.appendChild(card);
        }

        // ================================================================
        // CONTROLE DOS BOTS
        // ================================================================

        async function toggleBot(id) {
            const bot = bots.find(b => b.id === id);
            if (!bot) return;

            if (bot.ativo) {
                await desativarBot(id);
            } else {
                await ativarBot(id);
            }
        }

        async function ativarBot(id) {
            const bot = bots.find(b => b.id === id);
            if (!bot) return;

            if (!bot.token || !bot.token.startsWith('oauth:')) {
                notificar(`❌ Token inválido para ${bot.nome}.`, '#ff4444');
                return;
            }

            try {
                // Criar cliente TMI
                const client = new tmi.Client({
                    identity: {
                        username: bot.nome,
                        password: bot.token
                    },
                    channels: [bot.canal]
                });

                await client.connect();
                bot.client = client;
                bot.ativo = true;
                onlineCount++;

                // Atualizar UI
                const statusEl = document.getElementById(`status-${bot.id}`);
                if (statusEl) {
                    statusEl.className = 'card-status online';
                    statusEl.textContent = '🟢 Online';
                }
                const toggleBtn = document.getElementById(`toggle-${bot.id}`);
                if (toggleBtn) {
                    toggleBtn.classList.add('active');
                    toggleBtn.innerHTML = '<i class="fas fa-power-off"></i> Desativar';
                }

                addLog(bot.id, 'system', `✅ Conectado ao canal #${bot.canal}`);

                // Listeners
                client.on('message', async (channel, userstate, message, self) => {
                    if (self) return;
                    if (message.startsWith('!')) return;

                    const username = userstate['display-name'] || userstate.username;
                    const now = Date.now();

                    // Cooldown por usuário (60s)
                    if (bot.cooldowns[username] && (now - bot.cooldowns[username]) < 60000) return;
                    // Cooldown global (5s)
                    if ((now - bot.ultimaResposta) < 5000) return;
                    // Probabilidade de resposta (35%)
                    if (Math.random() > 0.35) return;

                    // Histórico
                    if (!bot.historico[username]) bot.historico[username] = [];
                    bot.historico[username].push(message);
                    if (bot.historico[username].length > 6) bot.historico[username].shift();

                    // Gerar resposta
                    const resposta = await gerarRespostaIA(
                        message,
                        username,
                        bot.nome,
                        bot.historico[username]
                    );

                    if (resposta) {
                        client.say(channel, resposta);
                        bot.ultimaResposta = now;
                        bot.cooldowns[username] = now;
                        addLog(bot.id, 'response', `💬 ${username}: ${resposta}`);
                    }
                });

                // Comentários espontâneos (a cada 2 minutos)
                const spontaneousInterval = setInterval(() => {
                    if (!bot.ativo) {
                        clearInterval(spontaneousInterval);
                        return;
                    }
                    const frases = [
                        "essa live tá muito boa! 🔥",
                        "alguém mais animado pro próximo jogo?",
                        "melhor live do dia, com certeza",
                        "quanto tempo hein, tava com saudade",
                        "hahaha esse momento foi épico",
                        "alguém sabe dizer que horas termina?",
                        "que gameplay insana, parabéns!",
                        "estou amando a interação no chat"
                    ];
                    const frase = frases[Math.floor(Math.random() * frases.length)];
                    try {
                        client.say(`#${bot.canal}`, frase);
                        addLog(bot.id, 'spontaneous', `🗣️ ${frase}`);
                    } catch (e) {}
                }, 120000);

                // Guardar o interval para limpeza
                bot._spontaneousInterval = spontaneousInterval;

                atualizarStats();
                notificar(`✅ Bot "${bot.nome}" ativado no canal #${bot.canal}`);

            } catch (error) {
                notificar(`❌ Erro ao ativar ${bot.nome}: ${error.message}`, '#ff4444');
                addLog(bot.id, 'error', `❌ Erro: ${error.message}`);
                bot.ativo = false;
                bot.client = null;
                onlineCount--;
                atualizarStats();
            }
        }

        async function desativarBot(id) {
            const bot = bots.find(b => b.id === id);
            if (!bot) return;

            if (bot.client) {
                try {
                    bot.client.disconnect();
                } catch (e) {}
                bot.client = null;
            }
            if (bot._spontaneousInterval) {
                clearInterval(bot._spontaneousInterval);
                delete bot._spontaneousInterval;
            }
            bot.ativo = false;
            onlineCount--;
            bot.ultimaResposta = 0;
            bot.cooldowns = {};

            // UI
            const statusEl = document.getElementById(`status-${bot.id}`);
            if (statusEl) {
                statusEl.className = 'card-status offline';
                statusEl.textContent = '🔴 Offline';
            }
            const toggleBtn = document.getElementById(`toggle-${bot.id}`);
            if (toggleBtn) {
                toggleBtn.classList.remove('active');
                toggleBtn.innerHTML = '<i class="fas fa-power-off"></i> Ativar';
            }

            addLog(bot.id, 'system', `⏹️ Bot desativado`);
            atualizarStats();
            notificar(`⏹️ Bot "${bot.nome}" desativado.`, '#ffaa00');
        }

        function removerBot(id) {
            const bot = bots.find(b => b.id === id);
            if (!bot) return;

            if (bot.ativo) {
                desativarBot(id);
            }

            const card = document.getElementById(`card-${bot.id}`);
            if (card) {
                card.style.transition = 'all 0.3s ease';
                card.style.transform = 'scale(0.8)';
                card.style.opacity = '0';
                setTimeout(() => {
                    card.remove();
                    bots = bots.filter(b => b.id !== id);
                    atualizarStats();
                    if (bots.length === 0) mostrarVazio();
                }, 300);
            }
            notificar(`🗑️ Bot "${bot.nome}" removido.`, '#ff4444');
        }

        // ================================================================
        // LOGS
        // ================================================================

        function addLog(botId, type, message) {
            const logDiv = document.getElementById(`log-${botId}`);
            if (!logDiv) return;
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            // Mantém no máximo 50 entradas
            while (logDiv.children.length > 50) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }

        // ================================================================
        // AÇÕES EM MASSA
        // ================================================================

        function ativarTodos() {
            bots.forEach(b => {
                if (!b.ativo) toggleBot(b.id);
            });
        }

        function desativarTodos() {
            bots.forEach(b => {
                if (b.ativo) toggleBot(b.id);
            });
        }

        function adicionarBotsExemplo(qtd) {
            const nomes = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon', 'Zeta', 'Eta', 'Theta'];
            const canais = ['meucanal', 'live_teste', 'streamerx', 'gameplay', 'twitch_br'];
            for (let i = 0; i < qtd; i++) {
                const nome = nomes[Math.floor(Math.random() * nomes.length)] + (i + 1);
                const canal = canais[Math.floor(Math.random() * canais.length)];
                const cores = ['#00ffff', '#ff00ff', '#ffaa00', '#00ff88', '#ff4466', '#66ccff'];
                const cor = cores[Math.floor(Math.random() * cores.length)];
                criarBot({ nome, canal, cor, token: GLOBAL_TOKEN });
            }
        }

        function mostrarVazio() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-robot"></i>
                    <h3>Nenhum bot ainda</h3>
                    <p style="color: #555;">Clique em "Novo Bot" para começar!</p>
                </div>
            `;
        }

        // ================================================================
        // MODAL
        // ================================================================

        function abrirModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('botName').focus();
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('formNovoBot').addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = document.getElementById('botName').value.trim();
            const canal = document.getElementById('botChannel').value.trim();
            const cor = document.getElementById('botColor').value;
            const token = document.getElementById('botToken').value.trim() || GLOBAL_TOKEN;

            if (!nome || !canal) {
                notificar('⚠️ Preencha nome e canal!', '#ffaa00');
                return;
            }

            criarBot({ nome, canal, cor, token });
            fecharModal();
            document.getElementById('formNovoBot').reset();
            document.getElementById('botColor').value = '#00ffff';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharModal();
        });
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) fecharModal();
        });

        // ================================================================
        // STATS
        // ================================================================

        function atualizarStats() {
            document.getElementById('totalBots').textContent = bots.length;
            document.getElementById('onlineBots').textContent = onlineCount;
        }

        // ================================================================
        // NOTIFICAÇÕES
        // ================================================================

        function notificar(mensagem, cor = '#00ffff') {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.borderColor = cor;
            notif.style.boxShadow = `0 0 40px rgba(0,0,0,0.8), 0 0 30px ${cor}40`;
            notif.innerHTML = mensagem;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        // ================================================================
        // INICIALIZAÇÃO
        // ================================================================

        function init() {
            // Criar bots de exemplo
            adicionarBotsExemplo(3);
            notificar('🚀 Sistema SocialCell Bots carregado!', '#00ffff');
            notificar('💡 Clique em "Ativar" em cada bot para conectá-lo ao chat.', '#ff00ff');

            console.log('🤖 SocialCell Bots iniciado!');
            console.log(`📱 ${bots.length} bots disponíveis.`);
            console.log('🔑 Use tokens válidos para conectar.');
        }

        document.addEventListener('DOMContentLoaded', init);

        // ================================================================
        // EXPOSIÇÃO GLOBAL PARA DEBUG
        // ================================================================

        window.bots = bots;
        window.criarBot = criarBot;
        window.ativarBot = ativarBot;
        window.desativarBot = desativarBot;
        window.removerBot = removerBot;
        window.ativarTodos = ativarTodos;
        window.desativarTodos = desativarTodos;
        window.adicionarBotsExemplo = adicionarBotsExemplo;
    </script>
</body>
</html>
