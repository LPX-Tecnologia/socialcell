<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialCell - Múltiplos Celulares</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            height: 60px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 100%;
            animation: neonLine 3s ease-in-out infinite;
        }

        @keyframes neonLine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo i {
            -webkit-text-fill-color: initial;
            color: #ff00ff;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            margin-right: 8px;
        }

        .stats span {
            color: #00ffff;
            font-weight: 700;
        }

        .btn {
            padding: 6px 14px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .btn:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn-purple {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-purple:hover {
            background: #ff00ff;
            color: #0a0a0a;
        }

        .btn-green {
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-green:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        /* ===== CONTAINER DE CELULARES ===== */
        .phones-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            display: flex;
            flex-wrap: nowrap;
            gap: 25px;
            overflow-x: auto;
            overflow-y: hidden;
            z-index: 1;
            align-items: flex-start;
            scroll-behavior: smooth;
        }

        .phones-container::-webkit-scrollbar {
            height: 8px;
        }

        .phones-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .phones-container::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 10px;
        }

        /* ===== CELULAR ===== */
        .phone-wrapper {
            flex: 0 0 auto;
            animation: fadeInUp 0.5s ease;
            transition: all 0.3s ease;
            position: relative;
        }

        .phone-wrapper:hover {
            transform: translateY(-5px);
            z-index: 10;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .phone {
            width: 360px;
            height: 620px;
            background: #1a1a1a;
            border-radius: 40px;
            padding: 8px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, transparent, #ff00ff, transparent);
            background-size: 400% 400%;
            border-radius: 42px;
            z-index: -1;
            animation: neonPhone 4s ease-in-out infinite;
            opacity: 0.3;
            transition: opacity 0.4s ease;
        }

        .phone:hover::before {
            opacity: 1;
        }

        @keyframes neonPhone {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Notch */
        .phone-notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            background: #0a0a0a;
            border-radius: 0 0 12px 12px;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .phone-notch .camera {
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #2a2a2a, #1a1a1a);
            border-radius: 50%;
            border: 1px solid #333;
        }

        .phone-notch .speaker {
            width: 35px;
            height: 3px;
            background: #2a2a2a;
            border-radius: 2px;
        }

        /* Botão fechar */
        .phone-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            color: #ff4444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            z-index: 4;
            transition: all 0.3s ease;
        }

        .phone-close:hover {
            background: rgba(255, 0, 0, 0.4);
            transform: scale(1.1);
        }

        /* Tela do celular (iframe) */
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            background: #0a0a0a;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Status Bar */
        .phone-status-bar {
            position: absolute;
            top: 32px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            padding: 2px 8px;
            font-size: 0.6rem;
            color: #fff;
            z-index: 2;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        .phone-status-bar .time {
            font-weight: 700;
        }

        /* Label da conta */
        .phone-label {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            color: #666;
            font-family: 'Orbitron', monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 12px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            z-index: 2;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Controles do celular */
        .phone-controls {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .phone-controls button {
            background: transparent;
            border: none;
            color: #fff;
            padding: 3px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.65rem;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
        }

        .phone-controls button:hover {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            transform: scale(1.1);
        }

        .phone-controls .btn-back {
            color: #00ffff;
        }

        .phone-controls .btn-refresh {
            color: #00ff88;
        }

        .phone-controls .btn-home {
            color: #ffaa00;
        }

        .phone-controls .btn-forward {
            color: #ff00ff;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 25px;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
            animation: modalSlide 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content .form-group {
            margin-bottom: 15px;
        }

        .modal-content label {
            display: block;
            color: #888;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 10px 12px;
            background: #0a0a0a;
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .modal-content input:focus,
        .modal-content select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .modal-content .btn-group-modal {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-content .btn-group-modal button {
            flex: 1;
            padding: 10px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .modal-content .btn-group-modal button:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .btn-close-modal {
            border-color: #ff4444 !important;
            color: #ff4444 !important;
        }

        .btn-close-modal:hover {
            background: #ff4444 !important;
            color: #fff !important;
        }

        /* ===== NOTIFICAÇÕES ===== */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffff;
            border-radius: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.4s ease, fadeOut 0.4s ease 3s forwards;
            max-width: 400px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(50px);
            }
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 768px) {
            .phone {
                width: 300px;
                height: 520px;
            }

            .header {
                padding: 5px 10px;
                height: 50px;
            }

            .logo {
                font-size: 1rem;
            }

            .stats {
                font-size: 0.6rem;
                gap: 6px;
            }

            .btn {
                padding: 4px 10px;
                font-size: 0.55rem;
            }

            .phones-container {
                top: 50px;
                padding: 10px;
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .phone {
                width: 260px;
                height: 460px;
                border-radius: 30px;
            }

            .phone-screen {
                border-radius: 22px;
            }

            .phone-notch {
                width: 70px;
                height: 16px;
                top: 6px;
            }

            .phone-status-bar {
                font-size: 0.5rem;
                top: 28px;
                padding: 1px 6px;
            }

            .phone-controls button {
                font-size: 0.55rem;
                padding: 2px 6px;
            }
        }

        /* Loading do iframe */
        .iframe-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .iframe-loading .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 255, 255, 0.1);
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-mobile-alt"></i>
            SocialCell
            <span style="font-size: 0.5rem; -webkit-text-fill-color: #666; font-weight: 400;">
                Multi-Phones
            </span>
        </div>
        <div class="header-controls">
            <div class="stats">
                <div>
                    <i class="fas fa-mobile-alt" style="color: #00ffff;"></i>
                    <span id="totalPhones">0</span>
                </div>
                <div>
                    <i class="fas fa-check-circle" style="color: #00ff88;"></i>
                    <span id="totalLoaded">0</span>
                </div>
            </div>
            <button class="btn" onclick="abrirModal()">
                <i class="fas fa-plus-circle"></i> Nova
            </button>
            <button class="btn btn-purple" onclick="criarMultiplas(10)">
                <i class="fas fa-layer-group"></i> +10
            </button>
            <button class="btn btn-green" onclick="criarMultiplas(50)">
                <i class="fas fa-rocket"></i> +50
            </button>
        </div>
    </header>

    <!-- ===== CONTAINER DE CELULARES ===== -->
    <div class="phones-container" id="phonesContainer">
        <!-- Celulares serão inseridos aqui -->
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2><i class="fas fa-plus-circle" style="color: #ff00ff;"></i> Novo Celular</h2>
            <form id="createPhoneForm">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Nome do Celular</label>
                    <input type="text" id="phoneName" placeholder="Ex: Instagram Pessoal" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-globe"></i> Site para Abrir</label>
                    <select id="siteSelect">
                        <option value="https://www.instagram.com">📸 Instagram</option>
                        <option value="https://www.facebook.com">👍 Facebook</option>
                        <option value="https://twitter.com">🐦 Twitter/X</option>
                        <option value="https://www.youtube.com">▶️ YouTube</option>
                        <option value="https://www.tiktok.com">🎵 TikTok</option>
                        <option value="https://www.linkedin.com">💼 LinkedIn</option>
                        <option value="https://web.whatsapp.com">💬 WhatsApp Web</option>
                        <option value="https://web.telegram.org">✈️ Telegram</option>
                        <option value="https://www.reddit.com">🤖 Reddit</option>
                        <option value="https://www.pinterest.com">📌 Pinterest</option>
                        <option value="https://www.twitch.tv">🎮 Twitch</option>
                        <option value="https://www.google.com">🔍 Google</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-link"></i> URL Personalizada</label>
                    <input type="url" id="customUrl" placeholder="https://exemplo.com">
                    <small style="color: #666; font-size: 0.7rem;">Deixe em branco para usar o site selecionado</small>
                </div>
                <div class="btn-group-modal">
                    <button type="submit">
                        <i class="fas fa-check"></i> Criar Celular
                    </button>
                    <button type="button" class="btn-close-modal" onclick="fecharModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // ESTADO
        // ============================================================
        let phones = [];
        let phoneCounter = 0;
        let loadedCount = 0;

        // ============================================================
        // FUNÇÕES PRINCIPAIS
        // ============================================================

        // Criar um novo celular
        function criarCelular(dados) {
            const id = ++phoneCounter;

            const phone = {
                id: id,
                nome: dados.nome || `Celular ${id}`,
                url: dados.url || 'https://www.google.com',
                criadoEm: new Date().toLocaleString('pt-BR'),
                carregado: false,
                iframe: null
            };

            phones.push(phone);
            renderizarCelular(phone);
            atualizarStats();

            // Animação
            gsap.from(`.phone-wrapper[data-id="${id}"]`, {
                scale: 0,
                rotation: -10,
                duration: 0.5,
                ease: 'back.out(1.7)'
            });

            notificar(`📱 Novo celular: ${phone.nome}`, '#00ffff');

            return phone;
        }

        // Renderizar o celular na tela
        function renderizarCelular(data) {
            const container = document.getElementById('phonesContainer');

            const wrapper = document.createElement('div');
            wrapper.className = 'phone-wrapper';
            wrapper.dataset.id = data.id;

            wrapper.innerHTML = `
                <div class="phone">
                    <button class="phone-close" onclick="removerCelular(${data.id})" title="Remover">
                        <i class="fas fa-times"></i>
                    </button>

                    <div class="phone-notch">
                        <div class="camera"></div>
                        <div class="speaker"></div>
                        <div class="camera"></div>
                    </div>

                    <div class="phone-screen" id="screen_${data.id}">
                        <div class="phone-status-bar">
                            <span class="time">${new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}</span>
                            <span class="icons">
                                <i class="fas fa-signal"></i>
                                <i class="fas fa-wifi"></i>
                                <i class="fas fa-battery-three-quarters"></i>
                            </span>
                        </div>

                        <div class="iframe-loading" id="loading_${data.id}">
                            <div class="spinner"></div>
                        </div>

                        <iframe 
                            id="iframe_${data.id}" 
                            src="${data.url}"
                            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
                            loading="lazy"
                            onload="iframeCarregou(${data.id})"
                            onerror="iframeErro(${data.id})"
                        ></iframe>
                    </div>

                    <div class="phone-label">${data.nome}</div>

                    <div class="phone-controls">
                        <button class="btn-back" onclick="navegar(${data.id}, 'back')" title="Voltar">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <button class="btn-refresh" onclick="recarregar(${data.id})" title="Recarregar">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button class="btn-home" onclick="irParaHome(${data.id})" title="Home">
                            <i class="fas fa-home"></i>
                        </button>
                        <button class="btn-forward" onclick="navegar(${data.id}, 'forward')" title="Avançar">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;

            container.appendChild(wrapper);

            // Atualizar hora em tempo real
            setInterval(() => {
                const timeEl = wrapper.querySelector('.phone-status-bar .time');
                if (timeEl) {
                    timeEl.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                }
            }, 10000);
        }

        // ============================================================
        // CONTROLES DO CELULAR
        // ============================================================

        function iframeCarregou(id) {
            const loading = document.getElementById(`loading_${id}`);
            if (loading) loading.style.display = 'none';

            const phone = phones.find(p => p.id === id);
            if (phone) {
                phone.carregado = true;
                loadedCount++;
                atualizarStats();
            }

            notificar(`✅ ${phone?.nome || 'Celular'} carregado!`, '#00ff88');
        }

        function iframeErro(id) {
            const loading = document.getElementById(`loading_${id}`);
            if (loading) loading.style.display = 'none';

            notificar(`⚠️ Erro ao carregar ${phones.find(p => p.id === id)?.nome}`, '#ff4444');
        }

        function navegar(id, direcao) {
            const iframe = document.getElementById(`iframe_${id}`);
            if (!iframe) return;

            try {
                if (direcao === 'back') {
                    iframe.contentWindow.history.back();
                } else if (direcao === 'forward') {
                    iframe.contentWindow.history.forward();
                }
            } catch (e) {
                notificar('⚠️ Navegação não disponível', '#ffaa00');
            }
        }

        function recarregar(id) {
            const iframe = document.getElementById(`iframe_${id}`);
            if (!iframe) return;

            const loading = document.getElementById(`loading_${id}`);
            if (loading) loading.style.display = 'block';

            iframe.src = iframe.src;

            gsap.from(`#screen_${id}`, {
                scale: 0.95,
                duration: 0.3,
                ease: 'power2.out'
            });

            notificar('🔄 Recarregando...', '#ffaa00');
        }

        function irParaHome(id) {
            const phone = phones.find(p => p.id === id);
            if (!phone) return;

            const iframe = document.getElementById(`iframe_${id}`);
            if (!iframe) return;

            const loading = document.getElementById(`loading_${id}`);
            if (loading) loading.style.display = 'block';

            try {
                const url = new URL(iframe.src);
                iframe.src = url.origin;
            } catch {
                iframe.src = phone.url;
            }

            notificar('🏠 Voltando para home', '#ffaa00');
        }

        // ============================================================
        // GERENCIAMENTO
        // ============================================================

        function removerCelular(id) {
            const index = phones.findIndex(p => p.id === id);
            if (index === -1) return;

            const phone = phones[index];
            if (phone.carregado) loadedCount--;

            const wrapper = document.querySelector(`.phone-wrapper[data-id="${id}"]`);
            if (wrapper) {
                gsap.to(wrapper, {
                    scale: 0,
                    rotation: 20,
                    opacity: 0,
                    duration: 0.4,
                    ease: 'power2.in',
                    onComplete: () => {
                        wrapper.remove();
                        phones.splice(index, 1);
                        atualizarStats();
                    }
                });
            }

            notificar(`🗑️ Removido: ${phone.nome}`, '#ff4444');
        }

        function criarMultiplas(quantidade) {
            const sites = [
                'https://www.instagram.com',
                'https://www.facebook.com',
                'https://twitter.com',
                'https://www.youtube.com',
                'https://www.tiktok.com',
                'https://www.linkedin.com',
                'https://web.whatsapp.com',
                'https://web.telegram.org',
                'https://www.reddit.com',
                'https://www.pinterest.com'
            ];

            const nomes = [
                'Instagram', 'Facebook', 'Twitter', 'YouTube', 'TikTok',
                'LinkedIn', 'WhatsApp', 'Telegram', 'Reddit', 'Pinterest'
            ];

            for (let i = 0; i < quantidade; i++) {
                const url = sites[Math.floor(Math.random() * sites.length)];
                const nome = nomes[Math.floor(Math.random() * nomes.length)];
                const num = Math.floor(Math.random() * 10000);

                criarCelular({
                    nome: `${nome} ${num}`,
                    url: url
                });
            }

            notificar(`📱 ${quantidade} celulares criados!`, '#00ffff');

            setTimeout(() => {
                const container = document.getElementById('phonesContainer');
                container.scrollTo({
                    left: container.scrollWidth,
                    behavior: 'smooth'
                });
            }, 500);
        }

        // ============================================================
        // STATS
        // ============================================================

        function atualizarStats() {
            document.getElementById('totalPhones').textContent = phones.length;
            document.getElementById('totalLoaded').textContent = loadedCount;
        }

        // ============================================================
        // MODAL
        // ============================================================

        function abrirModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('phoneName').focus();
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('createPhoneForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const nome = document.getElementById('phoneName').value.trim();
            const site = document.getElementById('siteSelect').value;
            const customUrl = document.getElementById('customUrl').value.trim();

            if (!nome) {
                notificar('⚠️ Digite um nome para o celular!', '#ffaa00');
                return;
            }

            const url = customUrl || site;

            criarCelular({ nome, url });

            fecharModal();
            document.getElementById('createPhoneForm').reset();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharModal();
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) fecharModal();
        });

        // ============================================================
        // NOTIFICAÇÕES
        // ============================================================

        function notificar(mensagem, cor = '#00ffff') {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.borderColor = cor;
            notif.style.boxShadow = `0 0 40px rgba(0,0,0,0.8), 0 0 30px ${cor}40`;
            notif.innerHTML = mensagem;
            document.body.appendChild(notif);

            setTimeout(() => {
                notif.remove();
            }, 3000);
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================

        function init() {
            // Criar celulares de exemplo
            const exemplos = [
                { nome: '📸 Instagram Pessoal', url: 'https://www.instagram.com' },
                { nome: '👍 Facebook Business', url: 'https://www.facebook.com' },
                { nome: '🐦 Twitter/X News', url: 'https://twitter.com' },
                { nome: '▶️ YouTube Canal', url: 'https://www.youtube.com' },
                { nome: '💼 LinkedIn Profissional', url: 'https://www.linkedin.com' },
                { nome: '🎵 TikTok Criador', url: 'https://www.tiktok.com' }
            ];

            exemplos.forEach(ex => criarCelular(ex));

            setTimeout(() => {
                notificar('🚀 Sistema carregado! Faça login em cada celular', '#00ffff');
            }, 1000);

            setTimeout(() => {
                notificar('💡 Cada celular tem navegação independente!', '#ff00ff');
            }, 3000);

            console.log('📱 SocialCell Multi-Phones carregado!');
            console.log(`📱 ${phones.length} celulares disponíveis`);
            console.log('💡 Clique em "Nova" para criar mais celulares');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
