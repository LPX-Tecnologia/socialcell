<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Bot Multi-Conta com Personalidades</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 25px;
            border: 2px solid #9146ff;
            box-shadow: 0 0 40px rgba(145, 70, 255, 0.2);
        }
        h1 {
            font-size: 2rem;
            text-align: center;
            color: #9146ff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-area {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #0f0f0f;
            border-radius: 15px;
            border: 1px solid #333;
        }
        .btn-twitch {
            background: #9146ff;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-twitch:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(145, 70, 255, 0.5);
        }
        .btn-twitch:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .manual-area {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .manual-area input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            flex: 1;
            min-width: 150px;
        }
        .manual-area input:focus {
            border-color: #9146ff;
            outline: none;
        }
        .btn-add {
            background: #00ff88;
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-add:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        .config-area {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .config-area input, .config-area select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            flex: 1;
            min-width: 150px;
        }
        .config-area input:focus, .config-area select:focus {
            border-color: #9146ff;
            outline: none;
        }
        .accounts-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .account-card {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            transition: 0.3s;
        }
        .account-card:hover {
            border-color: #9146ff;
        }
        .account-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .account-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #9146ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
        }
        .account-name {
            font-weight: bold;
            color: #ddd;
        }
        .account-status {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .status-online {
            background: #00ff8844;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .status-offline {
            background: #ff444444;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .account-personality {
            font-size: 0.7rem;
            color: #888;
            padding: 2px 10px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .account-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin: 2px;
        }
        .btn-activate {
            background: #00ff88;
            color: #0a0a0a;
        }
        .btn-activate:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        .btn-activate.active {
            background: #ff4444;
            color: #fff;
        }
        .btn-remove {
            background: #ff4444;
            color: #fff;
        }
        .btn-remove:hover {
            transform: scale(1.05);
        }
        .log-area {
            margin-top: 20px;
            background: #0a0a0a;
            border-radius: 10px;
            padding: 10px;
            max-height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: #aaa;
            border: 1px solid #333;
        }
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-entry.success {
            color: #00ff88;
        }
        .log-entry.error {
            color: #ff4444;
        }
        .log-entry.info {
            color: #66ccff;
        }
        .log-entry.chat {
            color: #ffaa00;
        }
        .log-entry.self {
            color: #9146ff;
        }
        .log-entry.bot {
            color: #00ddff;
        }
        .empty-message {
            color: #666;
            text-align: center;
            padding: 20px;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 0.8rem;
        }
        .small {
            font-size: 0.7rem;
            color: #888;
        }
        .personality-select {
            min-width: 120px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .account-card {
                flex-direction: column;
                align-items: stretch;
            }
            .account-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
            }
            .account-actions button {
                flex: 1;
            }
            .manual-area input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Twitch Bot Multi-Conta com Personalidades</h1>

    <!-- Login OAuth -->
    <div class="login-area">
        <button id="loginBtn" class="btn-twitch">🔑 Login com Twitch (OAuth)</button>
        <div style="margin-top: 10px; color: #888; font-size: 0.8rem;">
            <span style="color: #ffaa00;">⚠️ Se aparecer erro de 2FA, use a opção manual abaixo.</span>
        </div>

        <!-- Adicionar manual -->
        <div class="manual-area">
            <input type="text" id="manualTokenInput" placeholder="Token OAuth (ex: oauth:xxx)">
            <input type="text" id="manualUsernameInput" placeholder="Nome do bot">
            <select id="personalitySelect" class="personality-select">
                <option value="animado">🎉 Animado</option>
                <option value="sarcastico">😏 Sarcástico</option>
                <option value="filosofo">🧐 Filósofo</option>
                <option value="troll">🤪 Troll</option>
                <option value="fofo">🥰 Fofo</option>
                <option value="nerd">🤓 Nerd</option>
            </select>
            <select id="temperatureSelect" class="personality-select">
                <option value="leve">❄️ Leve</option>
                <option value="equilibrado" selected>⚖️ Equilibrado</option>
                <option value="quente">🔥 Quente</option>
            </select>
            <button class="btn-add" id="addTokenBtn">➕ Adicionar Bot</button>
        </div>
        <div class="small">Gere um token em <a href="https://twitchtokengenerator.com" target="_blank" style="color:#9146ff;">twitchtokengenerator.com</a> (Bot Chat Token)</div>
    </div>

    <!-- Configurações -->
    <div class="config-area">
        <input type="text" id="targetChannel" placeholder="Canal alvo (sem #)" value="lpxstreaming">
        <button id="setChannelBtn" class="btn-twitch" style="background: #333; color:#fff; padding:10px 20px;">Definir Canal</button>
        <button id="reconnectAllBtn" class="btn-twitch" style="background: #ffaa00; color:#0a0a0a; padding:10px 20px;">🔄 Reconectar Todos</button>
    </div>

    <!-- Lista de contas -->
    <div id="accountsContainer" class="accounts-list">
        <div class="empty-message">Nenhuma conta conectada. Adicione uma conta acima.</div>
    </div>

    <!-- Logs -->
    <div id="logArea" class="log-area">
        <div class="log-entry info">🚀 Sistema pronto. Adicione contas e ative os bots.</div>
    </div>

    <div class="footer">
        <a href="#" id="clearLogsBtn">Limpar logs</a>
    </div>
</div>

<script>
    // ================================================================
    // CONFIGURAÇÕES
    // ================================================================
    const TWITCH_IRC = 'wss://irc-ws.chat.twitch.tv:443';
    const CLIENT_ID = 'seu_client_id_aqui'; // Substitua pelo seu Client ID
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'chat:read chat:edit';

    // ================================================================
    // PERSONALIDADES
    // ================================================================
    const PERSONALITIES = {
        animado: {
            nome: '🎉 Animado',
            respostas: [
                "hahaha que legal! 😂", "isso é demais! 🔥", "adorei isso!", "que momento épico!",

            ],

            ],

        },
        sarcastico: {

            respostas: [
                "aham, claro... 😏", "nossa, que surpresa...", "nunca imaginei que isso aconteceria...",

                "que novidade...", "jura? 😒", "ah, sim, com certeza..."
            ],
            espontaneas: [
                "que live interessante...", "como sempre, incrível...", "nossa, que novidade...",
                "tá todo mundo muito animado aqui...", "que surpresa...", "hmm..."
            ],

        },
        filosofo: {
            nome: '🧐 Filósofo',
            respostas: [
                "mas será que isso é realmente verdade?", "interessante como a vida nos surpreende...",
                "isso me faz refletir sobre a existência...", "o que é real, afinal?",
                "a vida é feita de momentos como esse...", "será que estamos todos conectados?",
                "o universo é vasto e cheio de mistérios...", "profundo..."
            ],
            espontaneas: [
                "a vida é uma jornada, essa live é parte dela...",
                "o que você acha que vem depois?",
                "será que estamos todos sonhando?",
                "a cada segundo, uma nova possibilidade..."
            ],
            tom: "reflexivo, filosófico, usa perguntas retóricas"
        },
        troll: {
            nome: '🤪 Troll',
            respostas: [
                "kkkkkkk", "huehuehue", "isso foi muito troll kkk", "nossa, que vergonha kk",
                "imaginei que isso ia acontecer kkk", "coitado kkk", "kkkkk que isso",
                "mds kkkk", "tô rindo até agora kkk", "hahahaha"
            ],
            espontaneas: [
                "kkkkkk", "huehue", "que live kkkk", "tá bom demais kkk",
                "mds kkkk", "não aguento kkkk"
            ],
            tom: "irreverente, usa muitas risadas (kkk, huehue)"
        },
        fofo: {
            nome: '🥰 Fofo',
            respostas: [
                "que fofo! 💕", "ai que gracinha! 🥺", "tô amando isso!",
                "que bonitinho! 🥰", "meu coração tá quentinho!", "que legal! ❤️",
                "adorei! 💖", "que coisa mais linda!", "tô emocionado! 🥹"
            ],
            espontaneas: [
                "essa live é muito fofa! 💕", "alguém mais tá sentindo o amor?",
                "que dia bom! 🥰", "tô amando estar aqui!", "que vibe acolhedora!"
            ],
            tom: "carinhoso, usa muitos corações e emojis fofos"
        },
        nerd: {
            nome: '🤓 Nerd',
            respostas: [
                "tecnicamente falando...", "na verdade, segundo a ciência...",
                "é um fato conhecido que...", "curiosamente...",
                "estatisticamente falando...", "como dizem os especialistas...",
                "na minha pesquisa...", "de acordo com a lógica..."
            ],
            espontaneas: [
                "alguém mais sabe a teoria por trás disso?",
                "fato interessante: ...",
                "sabia que isso tem uma explicação científica?",
                "a ciência explica esse fenômeno."
            ],
            tom: "racional, gosta de fatos e dados"
        }
    };

    // ================================================================
    // ESTADO
    // ================================================================
    let accounts = {};
    let accountCounter = 0;
    let targetChannel = document.getElementById('targetChannel').value.trim() || 'lpxstreaming';
    let wsConnections = {};
    let reconnectTimers = {};

    // ================================================================
    // LOGS
    // ================================================================
    function addLog(message, type = 'info', accountId = null) {
        const logArea = document.getElementById('logArea');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        let prefix = '';
        if (accountId && accounts[accountId]) {
            prefix = `[${accounts[accountId].username}] `;
        }
        entry.textContent = prefix + message;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
        if (logArea.children.length > 250) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    // ================================================================
    // OAuth LOGIN
    // ================================================================
    document.getElementById('loginBtn').addEventListener('click', function() {
        if (!CLIENT_ID || CLIENT_ID === 'seu_client_id_aqui') {
            addLog('❌ Configure o CLIENT_ID no código.', 'error');
            return;
        }
        const authUrl =
            `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${SCOPES}`;
        window.open(authUrl, '_blank', 'width=600,height=700');
    });

    // Processar redirect OAuth
    function handleOAuthRedirect() {
        const hash = window.location.hash;
        if (hash) {
            const params = new URLSearchParams(hash.substring(1));
            const accessToken = params.get('access_token');
            if (accessToken) {
                window.history.replaceState({}, document.title, window.location.pathname);
                fetchUserInfo(accessToken);
            } else {
                addLog('❌ Token não encontrado na URL.', 'error');
            }
        }
    }

    async function fetchUserInfo(token) {
        try {
            const response = await fetch('https://api.twitch.tv/helix/users', {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Client-Id': CLIENT_ID
                }
            });
            const data = await response.json();
            if (data.data && data.data.length > 0) {
                const user = data.data[0];
                // Abre modal para escolher personalidade
                const personality = prompt(`Escolha a personalidade para ${user.display_name}:\n\n` +
                    Object.entries(PERSONALITIES).map(([key, p]) => `${key}: ${p.nome}`).join('\n') +
                    '\n\nDigite o nome da personalidade (ex: animado, sarcastico, filosofo, troll, fofo, nerd)',
                    'animado');
                const temp = prompt('Escolha a temperatura da conversa (leve, equilibrado, quente):', 'equilibrado');
                if (personality && PERSONALITIES[personality]) {
                    addAccount(token, user.display_name, personality, temp || 'equilibrado');
                } else {
                    addLog('❌ Personalidade inválida. Use animado, sarcastico, filosofo, troll, fofo, nerd.', 'error');
                }
            } else {
                addLog('❌ Não foi possível obter dados do usuário.', 'error');
            }
        } catch (e) {
            addLog(`❌ Erro ao buscar usuário: ${e.message}`, 'error');
        }
    }

    // ================================================================
    // ADICIONAR CONTA
    // ================================================================
    function addAccount(token, username, personality = 'animado', temperature = 'equilibrado') {
        token = token.trim();
        if (!token.startsWith('oauth:')) {
            token = 'oauth:' + token;
        }
        if (!token || !username) {
            addLog('⚠️ Preencha token e nome de usuário.', 'error');
            return;
        }
        // Verifica se já existe uma conta com esse nome
        for (let id in accounts) {
            if (accounts[id].username.toLowerCase() === username.toLowerCase()) {
                addLog(`⚠️ Conta ${username} já existe.`, 'error');
                return;
            }
        }
        const id = ++accountCounter;
        accounts[id] = {
            token: token,
            username: username.trim(),
            personality: personality || 'animado',
            temperature: temperature || 'equilibrado',
            status: 'offline',
            ws: null,
            interval: null,
            lastMessageTime: 0,
            userCooldowns: {},
            reconnectAttempts: 0,
            maxReconnectAttempts: 10,
            isReconnecting: false
        };
        renderAccounts();
        addLog(`✅ Conta ${username} adicionada! Personalidade: ${PERSONALITIES[personality]?.nome || personality}`, 'success', id);
        // Salvar no localStorage
        saveAccounts();
    }

    // ================================================================
    // SALVAR E CARREGAR CONTAS
    // ================================================================
    function saveAccounts() {
        try {
            const data = {};
            for (let id in accounts) {
                const acc = accounts[id];
                data[id] = {
                    token: acc.token,
                    username: acc.username,
                    personality: acc.personality,
                    temperature: acc.temperature,
                    status: 'offline'
                };
            }
            localStorage.setItem('twitchAccounts', JSON.stringify(data));
        } catch (e) {}
    }

    function loadAccounts() {
        try {
            const raw = localStorage.getItem('twitchAccounts');
            if (raw) {
                const data = JSON.parse(raw);
                for (let id in data) {
                    const acc = data[id];
                    // Garantir que o token tenha oauth:
                    let token = acc.token;
                    if (!token.startsWith('oauth:')) {
                        token = 'oauth:' + token;
                    }
                    // Verificar se a conta já existe
                    let exists = false;
                    for (let existingId in accounts) {
                        if (accounts[existingId].username.toLowerCase() === acc.username.toLowerCase()) {
                            exists = true;
                            break;
                        }
                    }
                    if (!exists) {
                        const newId = ++accountCounter;
                        accounts[newId] = {
                            token: token,
                            username: acc.username,
                            personality: acc.personality || 'animado',
                            temperature: acc.temperature || 'equilibrado',
                            status: 'offline',
                            ws: null,
                            interval: null,
                            lastMessageTime: 0,
                            userCooldowns: {},
                            reconnectAttempts: 0,
                            maxReconnectAttempts: 10,
                            isReconnecting: false
                        };
                    }
                }
                renderAccounts();
                addLog(`📂 ${Object.keys(accounts).length} contas carregadas do localStorage.`, 'info');
            }
        } catch (e) {
            console.error('Erro ao carregar contas:', e);
        }
    }

    // ================================================================
    // REMOVER CONTA
    // ================================================================
    function removeAccount(id) {
        if (accounts[id].status === 'online') {
            deactivateBot(id);
        }
        delete accounts[id];
        renderAccounts();
        saveAccounts();
        addLog(`🗑️ Conta removida.`, 'info');
    }

    // ================================================================
    // RENDERIZAR LISTA
    // ================================================================
    function renderAccounts() {
        const container = document.getElementById('accountsContainer');
        const ids = Object.keys(accounts);
        if (ids.length === 0) {
            container.innerHTML = `<div class="empty-message">Nenhuma conta conectada. Adicione uma conta acima.</div>`;
            return;
        }
        let html = '';
        ids.forEach(id => {
            const acc = accounts[id];
            const statusClass = acc.status === 'online' ? 'status-online' : 'status-offline';
            const statusText = acc.status === 'online' ? '🟢 Online' : '🔴 Offline';
            const btnText = acc.status === 'online' ? 'Desativar Bot' : 'Ativar Bot';
            const btnClass = acc.status === 'online' ? 'btn-activate active' : 'btn-activate';
            const avatarText = acc.username.substring(0, 2).toUpperCase();
            const personalityInfo = PERSONALITIES[acc.personality] || { nome: acc.personality };
            const tempLabel = acc.temperature === 'leve' ? '❄️ Leve' :
                acc.temperature === 'quente' ? '🔥 Quente' : '⚖️ Equilibrado';
            html += `
                <div class="account-card" data-id="${id}">
                    <div class="account-info">
                        <div class="account-avatar">${avatarText}</div>
                        <div>
                            <div class="account-name">${acc.username}</div>
                            <span class="account-status ${statusClass}">${statusText}</span>
                            <span class="account-personality">${personalityInfo.nome} | ${tempLabel}</span>
                        </div>
                    </div>
                    <div class="account-actions">
                        <button class="${btnClass}" onclick="toggleBot(${id})">${btnText}</button>
                        <button class="btn-remove" onclick="removeAccount(${id})">✕</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ================================================================
    // BOT (WebSocket)
    // ================================================================
    function toggleBot(id) {
        const acc = accounts[id];
        if (!acc) return;
        if (acc.status === 'online') {
            deactivateBot(id);
        } else {
            activateBot(id);
        }
    }

    function activateBot(id) {
        const acc = accounts[id];
        if (!acc) return;

        const channel = targetChannel;
        if (!channel) {
            addLog('❌ Defina um canal alvo primeiro.', 'error', id);
            return;
        }

        if (acc.status === 'online') return;

        // Resetar tentativas de reconexão
        acc.reconnectAttempts = 0;
        acc.isReconnecting = false;

        try {
            const ws = new WebSocket(TWITCH_IRC);
            acc.ws = ws;
            acc.status = 'connecting';
            renderAccounts();
            addLog(`🔄 Conectando ao chat da Twitch...`, 'info', id);

            ws.onopen = () => {
                ws.send(`PASS ${acc.token}`);
                ws.send(`NICK ${acc.username}`);
                ws.send(`JOIN #${channel}`);
                addLog(`✅ Conectado ao canal #${channel}`, 'success', id);
                acc.status = 'online';
                acc.reconnectAttempts = 0;
                renderAccounts();

                // Ping/Pong
                if (acc._pingInterval) clearInterval(acc._pingInterval);
                acc._pingInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send('PING :tmi.twitch.tv');
                    }
                }, 30000);

                // Comentários espontâneos
                if (acc._spontaneousInterval) clearInterval(acc._spontaneousInterval);
                acc._spontaneousInterval = setInterval(() => {
                    if (acc.status !== 'online') {
                        clearInterval(acc._spontaneousInterval);
                        return;
                    }
                    const personality = PERSONALITIES[acc.personality] || PERSONALITIES.animado;
                    const frases = personality.espontaneas || ["essa live tá muito boa! 🔥"];
                    const frase = frases[Math.floor(Math.random() * frases.length)];
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(`PRIVMSG #${channel} :${frase}`);
                        addLog(`🗣️ ${frase}`, 'info', id);
                    }
                }, 120000);
            };

            ws.onmessage = (event) => {
                const msg = event.data;

                // PING
                if (msg.startsWith('PING')) {
                    ws.send('PONG :tmi.twitch.tv');
                    return;
                }

                // Verifica se a mensagem é do próprio bot (não deve responder a si mesmo)
                if (msg.includes(`PRIVMSG #${channel} :`) && msg.includes(`:${acc.username}!`)) {
                    return;
                }

                // Parse de mensagem do chat
                const privmsgMatch = msg.match(/^:(\w+)!\w+@\w+\.tmi\.twitch\.tv PRIVMSG #(\w+) :(.+)$/);
                if (privmsgMatch) {
                    const username = privmsgMatch[1];
                    const channelName = privmsgMatch[2];
                    const message = privmsgMatch[3];

                    // Ignora mensagens que começam com ! (comandos)
                    if (message.startsWith('!')) return;

                    if (channelName.toLowerCase() === channel.toLowerCase()) {
                        // Verifica se a mensagem é de outro bot (que também está no sistema)
                        let isOtherBot = false;
                        for (let otherId in accounts) {
                            if (otherId != id && accounts[otherId].username.toLowerCase() === username.toLowerCase()) {
                                isOtherBot = true;
                                break;
                            }
                        }

                        // Se for de outro bot, aumenta a chance de resposta (60%)
                        const responseChance = isOtherBot ? 0.6 : 0.3;
                        // Se a mensagem mencionar o nome do bot, resposta garantida
                        const isMentioned = message.toLowerCase().includes(acc.username.toLowerCase());

                        if ((Math.random() < responseChance || isMentioned) && !message.startsWith('!')) {
                            const now = Date.now();
                            // Cooldown por usuário (60s, reduzido para 45s se for outro bot)
                            const cooldownTime = isOtherBot ? 45000 : 60000;
                            if (acc.userCooldowns[username] && (now - acc.userCooldowns[username]) < cooldownTime) return;
                            // Cooldown global (5s)
                            if ((now - acc.lastMessageTime) < 5000) return;

                            // Gerar resposta baseada na personalidade
                            const resposta = gerarResposta(acc, message, username, isOtherBot);

                            if (resposta) {
                                ws.send(`PRIVMSG #${channel} :${resposta}`);
                                acc.lastMessageTime = now;
                                acc.userCooldowns[username] = now;
                                const sender = isOtherBot ? `🤖 ${username}` : `💬 ${username}`;
                                addLog(`${sender} → 🤖 ${acc.username}: ${resposta}`, 'bot', id);
                            }
                        }

                        // Registrar mensagem no log (mesmo sem resposta)
                        if (!msg.includes(`:${acc.username}!`)) {
                            addLog(`💬 ${username}: ${message}`, 'chat', id);
                        }
                    }
                }
            };

            ws.onclose = (e) => {
                addLog(`⚠️ Conexão encerrada.`, 'error', id);
                if (acc.status === 'online' || acc.status === 'connecting') {
                    acc.status = 'offline';
                    renderAccounts();
                    // Tentar reconectar automaticamente
                    scheduleReconnect(id);
                }
            };

            ws.onerror = (err) => {
                addLog(`❌ Erro no WebSocket: ${err.message || 'erro desconhecido'}`, 'error', id);
                if (acc.status === 'online' || acc.status === 'connecting') {
                    acc.status = 'offline';
                    renderAccounts();
                    scheduleReconnect(id);
                }
            };

        } catch (e) {
            addLog(`❌ Erro ao ativar bot: ${e.message}`, 'error', id);
        }
    }

    // ================================================================
    // RECONEXÃO AUTOMÁTICA
    // ================================================================
    function scheduleReconnect(id) {
        const acc = accounts[id];
        if (!acc) return;
        if (acc.isReconnecting) return;
        acc.isReconnecting = true;

        const delay = Math.min(3000 * Math.pow(1.5, acc.reconnectAttempts), 30000);
        acc.reconnectAttempts++;

        addLog(`🔄 Tentando reconectar em ${Math.round(delay/1000)}s (tentativa ${acc.reconnectAttempts})...`, 'info', id);

        if (acc._reconnectTimer) clearTimeout(acc._reconnectTimer);
        acc._reconnectTimer = setTimeout(() => {
            acc.isReconnecting = false;
            if (acc.status !== 'online') {
                addLog(`🔄 Reconectando ${acc.username}...`, 'info', id);
                activateBot(id);
            }
        }, delay);
    }

    // ================================================================
    // GERAR RESPOSTA COM PERSONALIDADE
    // ================================================================
    function gerarResposta(acc, message, username, isOtherBot) {
        const personality = PERSONALITIES[acc.personality] || PERSONALITIES.animado;
        const temp = acc.temperature || 'equilibrado';

        let respostas = personality.respostas || [
            "hahaha verdade! 😂", "nossa, concordo!", "isso é épico! 🔥"
        ];

        // Ajustar tom baseado na temperatura
        let resposta = respostas[Math.floor(Math.random() * respostas.length)];

        // Se for outro bot, aumentar a interação
        if (isOtherBot) {
            // Respostas mais elaboradas para bots
            const botRespostas = [
                `concordo plenamente com você, ${username}! 👏`,
                `ótimo ponto, ${username}! nunca tinha pensado nisso!`,
                `hahaha ${username}, você é demais! 😂`,
                `pois é, ${username}, tô na mesma vibe!`,
                `exatamente, ${username}! isso faz todo sentido!`,
                `você sempre traz os melhores insights, ${username}!`,
                `nossa, ${username}, isso foi profundo!`,
                `hahaha não tankei, ${username}! 🤣`
            ];
            resposta = botRespostas[Math.floor(Math.random() * botRespostas.length)];
        }

        // Adicionar variação baseada na temperatura
        if (temp === 'leve') {
            // Respostas mais curtas e neutras
            const leves = ["sim", "verdade", "hmm", "ok", "aham", "entendi", "legal"];
            if (Math.random() < 0.3) {
                resposta = leves[Math.floor(Math.random() * leves.length)];
            }
        } else if (temp === 'quente') {
            // Respostas mais intensas
            if (Math.random() < 0.4) {
                const intensas = [
                    "ISSO MESMO! 🔥🔥🔥",
                    "NÃO PODIA CONCORDAR MAIS!",
                    "EXATAMENTE O QUE EU PENSO!",
                    "CARACA, SENSACIONAL!",
                    "MELHOR COMENTÁRIO DA LIVE!"
                ];
                resposta = intensas[Math.floor(Math.random() * intensas.length)];
            }
        }

        return resposta;
    }

    // ================================================================
    // DESATIVAR BOT
    // ================================================================
    function deactivateBot(id) {
        const acc = accounts[id];
        if (!acc) return;

        // Limpar timers
        if (acc._reconnectTimer) {
            clearTimeout(acc._reconnectTimer);
            acc._reconnectTimer = null;
        }
        if (acc._pingInterval) {
            clearInterval(acc._pingInterval);
            acc._pingInterval = null;
        }
        if (acc._spontaneousInterval) {
            clearInterval(acc._spontaneousInterval);
            acc._spontaneousInterval = null;
        }

        if (acc.ws) {
            try {
                acc.ws.close();
            } catch (e) {}
            acc.ws = null;
        }

        acc.status = 'offline';
        acc.isReconnecting = false;
        acc.lastMessageTime = 0;
        acc.userCooldowns = {};
        renderAccounts();
        saveAccounts();
        addLog(`⏹️ Bot desativado.`, 'info', id);
    }

    // ================================================================
    // RECONECTAR TODOS
    // ================================================================
    function reconnectAll() {
        for (let id in accounts) {
            const acc = accounts[id];
            if (acc.status === 'offline') {
                activateBot(id);
            }
        }
        addLog('🔄 Reconectando todos os bots...', 'info');
    }

    // ================================================================
    // EVENTOS DOM
    // ================================================================

    // Adicionar manual
    document.getElementById('addTokenBtn').addEventListener('click', function() {
        const token = document.getElementById('manualTokenInput').value.trim();
        const username = document.getElementById('manualUsernameInput').value.trim();
        const personality = document.getElementById('personalitySelect').value;
        const temperature = document.getElementById('temperatureSelect').value;

        if (!token || !username) {
            addLog('⚠️ Preencha token e nome de usuário.', 'error');
            return;
        }
        addAccount(token, username, personality, temperature);
        document.getElementById('manualTokenInput').value = '';
        document.getElementById('manualUsernameInput').value = '';
        saveAccounts();
    });

    // Definir canal
    document.getElementById('setChannelBtn').addEventListener('click', function() {
        const input = document.getElementById('targetChannel');
        const val = input.value.trim();
        if (val) {
            targetChannel = val;
            localStorage.setItem('twitchBotChannel', val);
            addLog(`📡 Canal alvo definido para #${targetChannel}`, 'info');
        } else {
            addLog('⚠️ Digite um nome de canal válido.', 'error');
        }
    });

    // Reconectar todos
    document.getElementById('reconnectAllBtn').addEventListener('click', reconnectAll);

    // Limpar logs
    document.getElementById('clearLogsBtn').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('logArea').innerHTML = '';
        addLog('🧹 Logs limpos.', 'info');
    });

    // ================================================================
    // CARREGAR DADOS SALVOS
    // ================================================================
    const savedChannel = localStorage.getItem('twitchBotChannel');
    if (savedChannel) {
        document.getElementById('targetChannel').value = savedChannel;
        targetChannel = savedChannel;
        addLog(`📡 Canal carregado: #${targetChannel}`, 'info');
    }

    document.getElementById('targetChannel').addEventListener('change', function() {
        localStorage.setItem('twitchBotChannel', this.value.trim());
    });

    // ================================================================
    // INICIALIZAÇÃO
    // ================================================================
    handleOAuthRedirect();
    loadAccounts();

    // Se houver contas salvas, ativar automaticamente (opcional)
    // Descomente abaixo se quiser ativar automaticamente
    // setTimeout(() => {
    //     for (let id in accounts) {
    //         if (accounts[id].status === 'offline') {
    //             activateBot(id);
    //         }
    //     }
    // }, 2000);

    // ================================================================
    // EXPOR FUNÇÕES GLOBAIS
    // ================================================================
    window.toggleBot = toggleBot;
    window.removeAccount = removeAccount;
    window.addAccount = addAccount;
    window.addLog = addLog;
    window.reconnectAll = reconnectAll;

    console.log('🤖 Twitch Bot Multi-Conta com Personalidades carregado!');
    console.log('🎭 Personalidades disponíveis:', Object.keys(PERSONALITIES).join(', '));
    console.log('📌 Use tokens gerados em twitchtokengenerator.com');
</script>
