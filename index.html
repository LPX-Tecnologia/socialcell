<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialCell Bots - Carregando...</title>
    <style>
        /* ===== TELA DE CARREGAMENTO ===== */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            transition: opacity 0.8s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0,255,255,0.1);
            border-top-color: #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-status {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #aaa;
        }
        #loading-status span { color: #00ffff; }
        .retry-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid #ffaa00;
            color: #ffaa00;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            display: none;
        }
        .retry-btn:hover {
            background: #ffaa00;
            color: #0a0a0a;
        }
    </style>
</head>
<body>

    <!-- ===== TELA DE CARREGAMENTO ===== -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div id="loading-status">Carregando <span>tmi.js</span>...</div>
        <button class="retry-btn" id="retryBtn">🔄 Tentar Novamente</button>
    </div>

    <!-- ===== CONTEÚDO PRINCIPAL (inicialmente oculto) ===== -->
    <div id="app" style="display:none;">
        <!-- INÍCIO DO SISTEMA (mesmo código anterior) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

        <style>
            /* ===== MESMO ESTILO ANTERIOR (copie aqui para não repetir) ===== */
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { font-family: 'Rajdhani', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at 20% 30%, rgba(0,255,255,0.03) 0%, transparent 50%); }
            .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; padding: 15px 25px; background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); border-radius: 20px; border: 2px solid rgba(0,255,255,0.2); margin-bottom: 30px; box-shadow: 0 0 40px rgba(0,255,255,0.05); }
            .logo { font-family: 'Orbitron', monospace; font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, #00ffff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 12px; }
            .logo i { -webkit-text-fill-color: initial; color: #ff00ff; }
            .header-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
            .stats { display: flex; gap: 20px; font-size: 0.85rem; }
            .stats span { color: #00ffff; font-weight: 700; }
            .btn { padding: 8px 18px; border: 2px solid #00ffff; border-radius: 8px; background: transparent; color: #00ffff; font-family: 'Orbitron', monospace; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
            .btn:hover { background: #00ffff; color: #0a0a0a; box-shadow: 0 0 30px rgba(0,255,255,0.3); transform: scale(1.05); }
            .btn-purple { border-color: #ff00ff; color: #ff00ff; }
            .btn-purple:hover { background: #ff00ff; color: #0a0a0a; }
            .btn-green { border-color: #00ff88; color: #00ff88; }
            .btn-green:hover { background: #00ff88; color: #0a0a0a; }
            .btn-danger { border-color: #ff4444; color: #ff4444; }
            .btn-danger:hover { background: #ff4444; color: #0a0a0a; }
            .cards-container { display: flex; flex-wrap: wrap; gap: 25px; justify-content: flex-start; align-items: stretch; }
            .card { flex: 0 0 calc(25% - 25px); min-width: 280px; background: rgba(20,20,20,0.95); border-radius: 25px; padding: 18px; border: 2px solid rgba(0,255,255,0.15); box-shadow: 0 0 30px rgba(0,255,255,0.05); transition: all 0.4s ease; display: flex; flex-direction: column; position: relative; animation: fadeInUp 0.5s ease; }
            .card:hover { transform: translateY(-5px); border-color: rgba(0,255,255,0.4); box-shadow: 0 10px 40px rgba(0,255,255,0.15); }
            .card::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; background: linear-gradient(45deg, #00ffff, transparent, #ff00ff, transparent); background-size: 400% 400%; border-radius: 27px; z-index: -1; animation: neonCard 4s ease-in-out infinite; opacity: 0; transition: opacity 0.4s ease; }
            .card:hover::before { opacity: 0.5; }
            @keyframes neonCard { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
            @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
            .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .card-name { font-family: 'Orbitron', monospace; font-size: 0.9rem; color: #00ffff; font-weight: 700; display: flex; align-items: center; gap: 8px; }
            .card-name .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 900; color: #0a0a0a; }
            .card-status { font-size: 0.7rem; padding: 4px 12px; border-radius: 20px; background: #333; color: #aaa; border: 1px solid transparent; transition: all 0.3s ease; }
            .card-status.online { background: rgba(0,255,136,0.15); color: #00ff88; border-color: #00ff88; animation: pulse 1.5s ease-in-out infinite; }
            .card-status.offline { background: rgba(255,68,68,0.1); color: #ff4444; border-color: #ff4444; }
            @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
            .card-info { font-size: 0.75rem; color: #888; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
            .card-info .channel { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 6px; }
            .card-info .channel i { color: #00ffff; }
            .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
            .card-actions button { flex: 1; min-width: 60px; padding: 8px 10px; border: 2px solid #00ffff; border-radius: 8px; background: transparent; color: #00ffff; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 5px; }
            .card-actions button:hover { background: #00ffff; color: #0a0a0a; transform: scale(1.05); box-shadow: 0 0 20px rgba(0,255,255,0.3); }
            .card-actions .btn-toggle { border-color: #ffaa00; color: #ffaa00; }
            .card-actions .btn-toggle:hover { background: #ffaa00; color: #0a0a0a; }
            .card-actions .btn-toggle.active { background: #00ff88; color: #0a0a0a; border-color: #00ff88; }
            .card-actions .btn-remove { border-color: #ff4444; color: #ff4444; flex: 0.5; }
            .card-actions .btn-remove:hover { background: #ff4444; color: #0a0a0a; }
            .card-log { margin-top: 10px; background: #0a0a0a; border-radius: 8px; padding: 6px 10px; max-height: 80px; overflow-y: auto; font-size: 0.65rem; font-family: 'Courier New', monospace; color: #666; border: 1px solid rgba(255,255,255,0.05); }
            .card-log .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
            .card-log .log-entry.system { color: #66ccff; }
            .card-log .log-entry.response { color: #00ff88; }
            .card-log .log-entry.spontaneous { color: #ffaa00; }
            .card-log .log-entry.error { color: #ff4444; }
            .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 1000; display: none; justify-content: center; align-items: center; }
            .modal-overlay.active { display: flex; }
            .modal-content { background: #1a1a1a; padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; border: 2px solid rgba(0,255,255,0.2); animation: modalSlide 0.4s ease; max-height: 90vh; overflow-y: auto; }
            @keyframes modalSlide { from { transform: translateY(-30px) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
            .modal-content h2 { font-family: 'Orbitron', monospace; color: #00ffff; text-align: center; margin-bottom: 20px; }
            .modal-content .form-group { margin-bottom: 15px; }
            .modal-content label { display: block; color: #888; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; }
            .modal-content input, .modal-content select { width: 100%; padding: 10px; background: #0a0a0a; border: 2px solid rgba(0,255,255,0.2); border-radius: 8px; color: #fff; font-size: 0.95rem; }
            .modal-content input:focus, .modal-content select:focus { outline: none; border-color: #00ffff; }
            .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
            .modal-buttons button { flex: 1; padding: 10px; border: 2px solid #00ffff; border-radius: 8px; background: transparent; color: #00ffff; font-family: 'Orbitron', monospace; font-weight: 700; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; font-size: 0.75rem; }
            .modal-buttons button:hover { background: #00ffff; color: #0a0a0a; }
            .modal-close { border-color: #ff4444 !important; color: #ff4444 !important; }
            .modal-close:hover { background: #ff4444 !important; color: #fff !important; }
            .notification { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; background: rgba(10,10,10,0.95); border: 2px solid #00ffff; border-radius: 10px; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 600; z-index: 9999; box-shadow: 0 0 40px rgba(0,0,0,0.8); backdrop-filter: blur(10px); animation: slideInRight 0.4s ease, fadeOut 0.4s ease 3s forwards; max-width: 350px; }
            @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
            @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(50px); } }
            @media (max-width: 1200px) { .card { flex: 0 0 calc(33.33% - 25px); } }
            @media (max-width: 900px) { .card { flex: 0 0 calc(50% - 25px); } }
            @media (max-width: 600px) { .card { flex: 0 0 100%; } .header { flex-direction: column; align-items: stretch; } .header-controls { justify-content: center; } .stats { justify-content: center; } }
            ::-webkit-scrollbar { width: 6px; }
            ::-webkit-scrollbar-track { background: #0a0a0a; }
            ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00ffff, #ff00ff); border-radius: 10px; }
            .empty-state { width: 100%; text-align: center; padding: 60px 20px; color: #666; }
            .empty-state i { font-size: 4rem; color: #333; margin-bottom: 20px; }
            .empty-state h3 { font-family: 'Orbitron', monospace; color: #444; }
        </style>

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-robot"></i> SocialCell Bots
                <span style="font-size:0.6rem; -webkit-text-fill-color:#666; font-weight:400;">Multi-Bot Twitch</span>
            </div>
            <div class="header-controls">
                <div class="stats">
                    <div><i class="fas fa-users" style="color:#00ffff;"></i> Bots: <span id="totalBots">0</span></div>
                    <div><i class="fas fa-check-circle" style="color:#00ff88;"></i> Online: <span id="onlineBots">0</span></div>
                </div>
                <button class="btn" onclick="abrirModal()"><i class="fas fa-plus-circle"></i> Novo Bot</button>
                <button class="btn btn-purple" onclick="adicionarBotsExemplo(3)"><i class="fas fa-layer-group"></i> +3 Exemplo</button>
                <button class="btn btn-green" onclick="ativarTodos()"><i class="fas fa-play"></i> Ativar Tudo</button>
                <button class="btn btn-danger" onclick="desativarTodos()"><i class="fas fa-stop"></i> Desativar Tudo</button>
            </div>
        </header>

        <!-- ===== CARDS ===== -->
        <div class="cards-container" id="cardsContainer"></div>

        <!-- ===== MODAL ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content">
                <h2><i class="fas fa-robot" style="color:#ff00ff;"></i> Novo Bot</h2>
                <form id="formNovoBot">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nome do Bot</label>
                        <input type="text" id="botName" placeholder="Ex: Botzinho01" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-hashtag"></i> Canal (sem #)</label>
                        <input type="text" id="botChannel" placeholder="canal_da_live" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> Cor do Avatar</label>
                        <input type="color" id="botColor" value="#00ffff">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-key"></i> Token OAuth (obrigatório)</label>
                        <input type="password" id="botToken" placeholder="oauth:..." required>
                        <small style="color:#666; font-size:0.7rem;">Use o token gerado no site twitchtokengenerator.com com escopos de chat.</small>
                    </div>
                    <div class="modal-buttons">
                        <button type="submit"><i class="fas fa-check"></i> Criar</button>
                        <button type="button" class="modal-close" onclick="fecharModal()"><i class="fas fa-times"></i></button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ===== SCRIPT PRINCIPAL ===== -->
        <script>
            // ================================================================
            // ESPERA O tmi.js CARREGAR
            // ================================================================
            function waitForTmi(callback, retries = 0) {
                if (typeof tmi !== 'undefined') {
                    callback(null, tmi);
                    return;
                }
                if (retries > 20) { // ~10 segundos
                    callback(new Error('Timeout ao carregar tmi.js'));
                    return;
                }
                setTimeout(() => waitForTmi(callback, retries + 1), 500);
            }

            // ================================================================
            // CONFIGURAÇÕES
            // ================================================================
            const OPENAI_API_KEY = ''; // Opcional

            // ================================================================
            // ESTADO
            // ================================================================
            let bots = [];
            let botCounter = 0;
            let onlineCount = 0;

            // ================================================================
            // FUNÇÕES DE IA
            // ================================================================
            async function gerarRespostaIA(mensagem, usuario, botName, historico = []) {
                // Simulação simples (sem OpenAI)
                const respostas = [
                    "hahaha verdade! 😂", "nossa, concordo plenamente!", "isso foi épico demais! 🔥",
                    "alguém mais tá amando essa live?", "que jogada insana!", "eu também tô achando incrível!",
                    "melhor momento da live com certeza", "hahaha que isso cara", "pois é, tô curtindo muito",
                    "alguém mais viu isso? 👀", "sim, concordo!", "que isso, monkaS", "POGGERS!", "KEKW", "LUL"
                ];
                await new Promise(r => setTimeout(r, 800 + Math.random() * 1200));
                return respostas[Math.floor(Math.random() * respostas.length)];
            }

            // ================================================================
            // GERENCIAMENTO DE BOTS
            // ================================================================

            function criarBot(dados) {
                const id = ++botCounter;
                const bot = {
                    id, nome: dados.nome || `Bot${id}`,
                    canal: dados.canal || 'canal_teste',
                    cor: dados.cor || '#00ffff',
                    token: dados.token || '',
                    ativo: false,
                    client: null,
                    historico: {},
                    cooldowns: {},
                    ultimaResposta: 0,
                    log: [],
                    _spontaneousInterval: null
                };
                bots.push(bot);
                renderizarBot(bot);
                atualizarStats();
                notificar(`🤖 Bot "${bot.nome}" criado!`);
                return bot;
            }

            function renderizarBot(bot) {
                const container = document.getElementById('cardsContainer');
                const empty = container.querySelector('.empty-state');
                if (empty) empty.remove();

                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.botId = bot.id;
                card.id = `card-${bot.id}`;

                const initials = bot.nome.split(' ').map(w => w[0]).join('').toUpperCase().substring(0, 2);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-name">
                            <span class="avatar" style="background:${bot.cor};">${initials}</span>
                            ${bot.nome}
                        </div>
                        <span class="card-status offline" id="status-${bot.id}">🔴 Offline</span>
                    </div>
                    <div class="card-info">
                        <div class="channel"><i class="fas fa-hashtag"></i> ${bot.canal}</div>
                        <div style="display:flex; gap:8px; font-size:0.65rem; color:#666;">
                            <span><i class="fas fa-key"></i> Token: ${bot.token ? '●●●●' : '❌'}</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-toggle" id="toggle-${bot.id}" onclick="toggleBot(${bot.id})">
                            <i class="fas fa-power-off"></i> Ativar
                        </button>
                        <button class="btn-remove" onclick="removerBot(${bot.id})">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                    <div class="card-log" id="log-${bot.id}">
                        <div class="log-entry system">🟢 Bot criado. Aguardando ativação...</div>
                    </div>
                `;

                container.appendChild(card);
            }

            // ================================================================
            // CONTROLE DOS BOTS
            // ================================================================

            function toggleBot(id) {
                const bot = bots.find(b => b.id === id);
                if (!bot) return;
                if (bot.ativo) desativarBot(id);
                else ativarBot(id);
            }

            function ativarBot(id) {
                const bot = bots.find(b => b.id === id);
                if (!bot) return;

                if (typeof tmi === 'undefined') {
                    addLog(bot.id, 'error', '❌ tmi.js não carregado. Recarregue a página.');
                    notificar('❌ tmi.js não carregado.', '#ff4444');
                    return;
                }

                if (!bot.token || !bot.token.startsWith('oauth:')) {
                    addLog(bot.id, 'error', '❌ Token inválido. Deve começar com "oauth:"');
                    notificar(`❌ Token inválido para ${bot.nome}.`, '#ff4444');
                    return;
                }

                try {
                    const client = new tmi.Client({
                        identity: { username: bot.nome, password: bot.token },
                        channels: [bot.canal]
                    });

                    bot.client = client;
                    bot.ativo = true;
                    onlineCount++;

                    const statusEl = document.getElementById(`status-${bot.id}`);
                    if (statusEl) { statusEl.className = 'card-status online'; statusEl.textContent = '🟢 Online'; }
                    const toggleBtn = document.getElementById(`toggle-${bot.id}`);
                    if (toggleBtn) { toggleBtn.classList.add('active'); toggleBtn.innerHTML = '<i class="fas fa-power-off"></i> Desativar'; }

                    addLog(bot.id, 'system', `🔄 Conectando ao canal #${bot.canal}...`);

                    client.connect().then(() => {
                        addLog(bot.id, 'system', `✅ Conectado ao canal #${bot.canal}`);
                        notificar(`✅ Bot "${bot.nome}" conectado ao canal #${bot.canal}`);
                    }).catch(err => {
                        addLog(bot.id, 'error', `❌ Erro na conexão: ${err.message}`);
                        notificar(`❌ Erro ao conectar ${bot.nome}: ${err.message}`, '#ff4444');
                        desativarBot(bot.id);
                    });

                    client.on('message', async (channel, userstate, message, self) => {
                        if (self) return;
                        if (message.startsWith('!')) return;

                        const username = userstate['display-name'] || userstate.username;
                        const now = Date.now();

                        if (bot.cooldowns[username] && (now - bot.cooldowns[username]) < 60000) return;
                        if ((now - bot.ultimaResposta) < 5000) return;
                        if (Math.random() > 0.35) return;

                        if (!bot.historico[username]) bot.historico[username] = [];
                        bot.historico[username].push(message);
                        if (bot.historico[username].length > 6) bot.historico[username].shift();

                        const resposta = await gerarRespostaIA(message, username, bot.nome, bot.historico[username]);
                        if (resposta) {
                            client.say(channel, resposta);
                            bot.ultimaResposta = now;
                            bot.cooldowns[username] = now;
                            addLog(bot.id, 'response', `💬 ${username}: ${resposta}`);
                        }
                    });

                    if (bot._spontaneousInterval) clearInterval(bot._spontaneousInterval);
                    bot._spontaneousInterval = setInterval(() => {
                        if (!bot.ativo) { clearInterval(bot._spontaneousInterval); bot._spontaneousInterval = null; return; }
                        const frases = [
                            "essa live tá muito boa! 🔥", "alguém mais animado pro próximo jogo?",
                            "melhor live do dia, com certeza", "quanto tempo hein, tava com saudade",
                            "hahaha esse momento foi épico", "alguém sabe dizer que horas termina?",
                            "que gameplay insana, parabéns!", "estou amando a interação no chat"
                        ];
                        const frase = frases[Math.floor(Math.random() * frases.length)];
                        try {
                            if (bot.client && bot.ativo) {
                                bot.client.say(`#${bot.canal}`, frase);
                                addLog(bot.id, 'spontaneous', `🗣️ ${frase}`);
                            }
                        } catch (e) {}
                    }, 120000);

                    atualizarStats();
                } catch (error) {
                    addLog(bot.id, 'error', `❌ Erro: ${error.message}`);
                    notificar(`❌ Erro ao ativar ${bot.nome}: ${error.message}`, '#ff4444');
                    bot.ativo = false;
                    bot.client = null;
                    onlineCount--;
                    atualizarStats();
                }
            }

            function desativarBot(id) {
                const bot = bots.find(b => b.id === id);
                if (!bot) return;
                if (bot.client) { try { bot.client.disconnect(); } catch(e) {} bot.client = null; }
                if (bot._spontaneousInterval) { clearInterval(bot._spontaneousInterval); bot._spontaneousInterval = null; }
                bot.ativo = false;
                if (onlineCount > 0) onlineCount--;
                bot.ultimaResposta = 0;
                bot.cooldowns = {};

                const statusEl = document.getElementById(`status-${bot.id}`);
                if (statusEl) { statusEl.className = 'card-status offline'; statusEl.textContent = '🔴 Offline'; }
                const toggleBtn = document.getElementById(`toggle-${bot.id}`);
                if (toggleBtn) { toggleBtn.classList.remove('active'); toggleBtn.innerHTML = '<i class="fas fa-power-off"></i> Ativar'; }

                addLog(bot.id, 'system', `⏹️ Bot desativado`);
                atualizarStats();
                notificar(`⏹️ Bot "${bot.nome}" desativado.`, '#ffaa00');
            }

            function removerBot(id) {
                const bot = bots.find(b => b.id === id);
                if (!bot) return;
                if (bot.ativo) desativarBot(id);
                const card = document.getElementById(`card-${bot.id}`);
                if (card) {
                    card.style.transition = 'all 0.3s ease';
                    card.style.transform = 'scale(0.8)';
                    card.style.opacity = '0';
                    setTimeout(() => {
                        card.remove();
                        bots = bots.filter(b => b.id !== id);
                        atualizarStats();
                        if (bots.length === 0) mostrarVazio();
                    }, 300);
                }
                notificar(`🗑️ Bot "${bot.nome}" removido.`, '#ff4444');
            }

            function addLog(botId, type, message) {
                const logDiv = document.getElementById(`log-${botId}`);
                if (!logDiv) return;
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.textContent = message;
                logDiv.appendChild(entry);
                logDiv.scrollTop = logDiv.scrollHeight;
                while (logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
            }

            // ================================================================
            // AÇÕES EM MASSA
            // ================================================================

            function ativarTodos() { bots.forEach(b => { if (!b.ativo) toggleBot(b.id); }); }
            function desativarTodos() { bots.forEach(b => { if (b.ativo) toggleBot(b.id); }); }

            function adicionarBotsExemplo(qtd) {
                const nomes = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon', 'Zeta', 'Eta', 'Theta'];
                const canais = ['meucanal', 'live_teste', 'streamerx', 'gameplay', 'twitch_br'];
                for (let i = 0; i < qtd; i++) {
                    const nome = nomes[Math.floor(Math.random() * nomes.length)] + (i + 1);
                    const canal = canais[Math.floor(Math.random() * canais.length)];
                    const cores = ['#00ffff', '#ff00ff', '#ffaa00', '#00ff88', '#ff4466', '#66ccff'];
                    const cor = cores[Math.floor(Math.random() * cores.length)];
                    const token = 'oauth:seu_token_aqui';
                    criarBot({ nome, canal, cor, token });
                }
            }

            function mostrarVazio() {
                const container = document.getElementById('cardsContainer');
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-robot"></i>
                        <h3>Nenhum bot ainda</h3>
                        <p style="color:#555;">Clique em "Novo Bot" para começar!</p>
                    </div>
                `;
            }

            // ================================================================
            // MODAL
            // ================================================================

            function abrirModal() {
                document.getElementById('modalOverlay').classList.add('active');
                document.getElementById('botName').focus();
            }
            function fecharModal() {
                document.getElementById('modalOverlay').classList.remove('active');
            }

            document.getElementById('formNovoBot').addEventListener('submit', (e) => {
                e.preventDefault();
                const nome = document.getElementById('botName').value.trim();
                const canal = document.getElementById('botChannel').value.trim();
                const cor = document.getElementById('botColor').value;
                const token = document.getElementById('botToken').value.trim();
                if (!nome || !canal) { notificar('⚠️ Preencha nome e canal!', '#ffaa00'); return; }
                if (!token || !token.startsWith('oauth:')) { notificar('⚠️ Token OAuth inválido. Deve começar com "oauth:"', '#ffaa00'); return; }
                criarBot({ nome, canal, cor, token });
                fecharModal();
                document.getElementById('formNovoBot').reset();
                document.getElementById('botColor').value = '#00ffff';
            });

            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharModal(); });
            document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) fecharModal(); });

            // ================================================================
            // STATS E NOTIFICAÇÕES
            // ================================================================

            function atualizarStats() {
                document.getElementById('totalBots').textContent = bots.length;
                document.getElementById('onlineBots').textContent = onlineCount;
            }

            function notificar(mensagem, cor = '#00ffff') {
                const notif = document.createElement('div');
                notif.className = 'notification';
                notif.style.borderColor = cor;
                notif.style.boxShadow = `0 0 40px rgba(0,0,0,0.8), 0 0 30px ${cor}40`;
                notif.innerHTML = mensagem;
                document.body.appendChild(notif);
                setTimeout(() => notif.remove(), 3000);
            }

            // ================================================================
            // INICIALIZAÇÃO QUANDO tmi.js ESTIVER PRONTO
            // ================================================================

            function iniciarSistema() {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app').style.display = 'block';
                adicionarBotsExemplo(2);
                notificar('🚀 Sistema SocialCell Bots carregado!', '#00ffff');
                notificar('🔑 Substitua os tokens pelos seus tokens OAuth válidos.', '#ffaa00');
                console.log('🤖 SocialCell Bots iniciado com sucesso!');
            }

            // Aguarda o carregamento do tmi.js
            waitForTmi((err, tmiLib) => {
                if (err) {
                    document.getElementById('loading-status').innerHTML = '❌ Falha ao carregar <span>tmi.js</span>.';
                    document.getElementById('retryBtn').style.display = 'inline-block';
                    document.getElementById('retryBtn').onclick = () => location.reload();
                    return;
                }
                // tmi.js carregado, inicia o sistema
                iniciarSistema();
            });

            // Fallback: se após 10 segundos ainda não carregou, mostra botão
            setTimeout(() => {
                if (document.getElementById('loading-screen') && !document.getElementById('loading-screen').classList.contains('hidden')) {
                    document.getElementById('loading-status').innerHTML = '⏳ Demorando mais que o esperado... <span>Tente recarregar</span>';
                    document.getElementById('retryBtn').style.display = 'inline-block';
                    document.getElementById('retryBtn').onclick = () => location.reload();
                }
            }, 10000);
        </script>
    </div>

    <!-- ===== CARREGADOR DINÂMICO DO tmi.js ===== -->
    <script>
        // Carrega tmi.js de múltiplos CDNs
        (function loadTmi() {
            const CDNS = [
                'https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/tmi.min.js',
                'https://unpkg.com/tmi.js@1.8.5/tmi.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/tmi.js/1.8.5/tmi.min.js'
            ];
            let attempts = 0;

            function tryLoad(index) {
                if (index >= CDNS.length) {
                    // Todos falharam
                    document.getElementById('loading-status').innerHTML = '❌ Falha ao carregar <span>tmi.js</span>.';
                    document.getElementById('retryBtn').style.display = 'inline-block';
                    document.getElementById('retryBtn').onclick = () => location.reload();
                    return;
                }
                const script = document.createElement('script');
                script.src = CDNS[index];
                script.onload = () => {
                    if (typeof tmi !== 'undefined') {
                        // Sucesso
                        document.dispatchEvent(new Event('tmiLoaded'));
                    } else {
                        // Carregou mas não definiu a variável global
                        tryLoad(index + 1);
                    }
                };
                script.onerror = () => tryLoad(index + 1);
                document.head.appendChild(script);
            }

            // Inicia o carregamento
            tryLoad(0);

            // Evento personalizado quando tmi.js é carregado
            document.addEventListener('tmiLoaded', () => {
                // O sistema já está aguardando via waitForTmi
            });
        })();
    </script>
</body>
