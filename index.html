<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialCell - Gerenciador Multi-Conta</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 100%;
            animation: neonLine 3s ease-in-out infinite;
        }

        @keyframes neonLine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 3s ease-in-out infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-stats {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.1);
        }

        .stat-item span {
            color: #00ffff;
            font-weight: 700;
        }

        .btn-neon {
            padding: 8px 18px;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 8px;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-neon:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .btn-neon-purple {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-neon-purple:hover {
            background: #ff00ff;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.5);
        }

        .btn-neon-green {
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-neon-green:hover {
            background: #00ff88;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
        }

        /* ===== CONTAINER ===== */
        .accounts-container {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
            min-height: calc(100vh - 80px);
        }

        /* ===== CARD DE CONTA ===== */
        .account-card {
            flex: 0 0 calc(25% - 20px);
            min-width: 280px;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
            transition: all 0.4s ease;
            animation: fadeInUp 0.5s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .account-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.15);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .account-name {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: #00ffff;
            font-weight: 700;
        }

        .account-id {
            font-size: 0.6rem;
            color: #666;
            font-family: 'Orbitron', monospace;
        }

        .card-actions button {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .card-actions button:hover {
            color: #ff4444;
            background: rgba(255, 0, 0, 0.1);
        }

        .url-display {
            font-size: 0.75rem;
            color: #888;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
            word-break: break-all;
        }

        .url-display i {
            color: #00ffff;
            margin-right: 8px;
        }

        .account-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 15px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.online {
            background: #00ff88;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .dot.offline {
            background: #ff4444;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .account-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .account-buttons button {
            flex: 1;
            min-width: 70px;
            padding: 10px 12px;
            border: 2px solid #00ffff;
            border-radius: 10px;
            background: transparent;
            color: #00ffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .account-buttons button:hover {
            background: #00ffff;
            color: #0a0a0a;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .btn-open {
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-open:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        .btn-popup {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-popup:hover {
            background: #ff00ff;
            color: #0a0a0a;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 25px;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
            animation: modalSlide 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content .form-group {
            margin-bottom: 15px;
        }

        .modal-content label {
            display: block;
            color: #888;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 10px 12px;
            background: #0a0a0a;
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .modal-content input:focus,
        .modal-content select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .modal-content .btn-group-modal {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-content .btn-group-modal button {
            flex: 1;
            padding: 10px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .modal-content .btn-group-modal button:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .btn-close-modal {
            border-color: #ff4444 !important;
            color: #ff4444 !important;
        }

        .btn-close-modal:hover {
            background: #ff4444 !important;
            color: #fff !important;
        }

        /* ===== NOTIFICAÇÕES ===== */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffff;
            border-radius: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.4s ease, fadeOut 0.4s ease 3s forwards;
            max-width: 400px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(50px);
            }
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 1200px) {
            .account-card {
                flex: 0 0 calc(33.33% - 20px);
            }
        }

        @media (max-width: 900px) {
            .account-card {
                flex: 0 0 calc(50% - 20px);
            }
        }

        @media (max-width: 600px) {
            .account-card {
                flex: 0 0 100%;
            }

            .header {
                padding: 8px 10px;
            }

            .logo-text {
                font-size: 1.1rem;
            }

            .header-stats {
                font-size: 0.65rem;
                gap: 5px;
            }

            .stat-item {
                padding: 2px 6px;
            }

            .btn-neon {
                padding: 5px 10px;
                font-size: 0.6rem;
            }

            .accounts-container {
                padding: 10px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo-container">
            <div style="font-size: 2rem;">📱</div>
            <div>
                <div class="logo-text">SocialCell</div>
                <div style="font-size: 0.55rem; color: #666; font-family: 'Orbitron', monospace; letter-spacing: 2px;">
                    <i class="fas fa-window-restore" style="color: #00ffff;"></i> MULTI-CONTA
                </div>
            </div>
        </div>
        <div class="header-controls">
            <div class="header-stats">
                <div class="stat-item">
                    <i class="fas fa-users" style="color: #00ffff;"></i>
                    <span id="totalAccounts">0</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-check-circle" style="color: #00ff88;"></i>
                    <span id="totalOnline">0</span>
                </div>
            </div>
            <button class="btn-neon" onclick="abrirModal()">
                <i class="fas fa-plus-circle"></i> Nova
            </button>
            <button class="btn-neon btn-neon-purple" onclick="criarMultiplas(10)">
                <i class="fas fa-layer-group"></i> +10
            </button>
            <button class="btn-neon btn-neon-green" onclick="criarMultiplas(50)">
                <i class="fas fa-rocket"></i> +50
            </button>
        </div>
    </header>

    <!-- ===== CONTAINER ===== -->
    <div class="accounts-container" id="accountsContainer">
        <!-- Contas serão inseridas aqui -->
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2><i class="fas fa-plus-circle" style="color: #ff00ff;"></i> Nova Conta</h2>
            <form id="createAccountForm">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Nome da Conta</label>
                    <input type="text" id="accountName" placeholder="Ex: Instagram Pessoal" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-globe"></i> Rede Social</label>
                    <select id="socialNetwork">
                        <option value="https://www.instagram.com">📸 Instagram</option>
                        <option value="https://www.facebook.com">👍 Facebook</option>
                        <option value="https://twitter.com">🐦 Twitter / X</option>
                        <option value="https://www.youtube.com">▶️ YouTube</option>
                        <option value="https://www.tiktok.com">🎵 TikTok</option>
                        <option value="https://www.linkedin.com">💼 LinkedIn</option>
                        <option value="https://web.whatsapp.com">💬 WhatsApp Web</option>
                        <option value="https://web.telegram.org">✈️ Telegram Web</option>
                        <option value="https://www.reddit.com">🤖 Reddit</option>
                        <option value="https://www.pinterest.com">📌 Pinterest</option>
                        <option value="https://www.twitch.tv">🎮 Twitch</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-link"></i> URL Personalizada</label>
                    <input type="url" id="customUrl" placeholder="https://exemplo.com">
                    <small style="color: #666; font-size: 0.7rem;">Deixe em branco para usar a rede selecionada</small>
                </div>
                <div class="btn-group-modal">
                    <button type="submit">
                        <i class="fas fa-check"></i> Criar
                    </button>
                    <button type="button" class="btn-close-modal" onclick="fecharModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // ESTADO
        // ============================================================
        let accounts = [];
        let accountCounter = 0;
        let onlineCount = 0;

        // ============================================================
        // FUNÇÕES PRINCIPAIS
        // ============================================================
        function criarConta(data) {
            const id = ++accountCounter;

            const account = {
                id: id,
                name: data.name || `Conta ${id}`,
                url: data.url || 'https://www.google.com',
                createdAt: new Date().toLocaleString('pt-BR'),
                status: 'offline',
                window: null
            };

            accounts.push(account);
            renderizarConta(account);
            atualizarStats();

            gsap.from(`.account-card[data-id="${id}"]`, {
                scale: 0.8,
                opacity: 0,
                duration: 0.5,
                ease: 'back.out(1.7)'
            });

            mostrarNotificacao(`✅ Conta criada: ${account.name}`, '#00ffff');

            return account;
        }

        function renderizarConta(data) {
            const container = document.getElementById('accountsContainer');

            const card = document.createElement('div');
            card.className = 'account-card';
            card.dataset.id = data.id;

            const urlDisplay = data.url.length > 50 ? data.url.substring(0, 50) + '...' : data.url;

            card.innerHTML = `
                <div class="card-header">
                    <span class="account-name">
                        <i class="fas fa-user-circle" style="color: #ff00ff;"></i>
                        ${data.name}
                    </span>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="account-id">#${data.id}</span>
                        <div class="card-actions">
                            <button onclick="removerConta(${data.id})" title="Remover">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="url-display">
                    <i class="fas fa-link"></i>
                    ${urlDisplay}
                </div>

                <div class="account-status">
                    <span class="dot ${data.status === 'online' ? 'online' : 'offline'}" id="dot_${data.id}"></span>
                    <span id="statusText_${data.id}">${data.status === 'online' ? '🟢 Conectado' : '🔴 Desconectado'}</span>
                    <span style="margin-left: auto; font-size: 0.6rem; color: #444;">
                        <i class="far fa-clock"></i> ${data.createdAt}
                    </span>
                </div>

                <div class="account-buttons">
                    <button class="btn-open" onclick="abrirConta(${data.id})">
                        <i class="fas fa-external-link-alt"></i> Abrir
                    </button>
                    <button class="btn-popup" onclick="abrirPopup(${data.id})">
                        <i class="fas fa-window-restore"></i> Popup
                    </button>
                </div>
            `;

            container.appendChild(card);
        }

        // ============================================================
        // ABRIR CONTAS
        // ============================================================

        // 1. Abrir na mesma janela (navegação normal)
        function abrirConta(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;

            // Abre em uma nova aba/janela
            const win = window.open(account.url, `_blank`);

            if (win) {
                account.status = 'online';
                account.window = win;
                onlineCount++;
                atualizarStatus(id);
                atualizarStats();
                mostrarNotificacao(`🌐 Abrindo: ${account.name}`, '#00ff88');

                // Monitorar fechamento
                const checkWin = setInterval(() => {
                    if (win.closed) {
                        clearInterval(checkWin);
                        account.status = 'offline';
                        account.window = null;
                        onlineCount--;
                        atualizarStatus(id);
                        atualizarStats();
                        mostrarNotificacao(`👋 Fechado: ${account.name}`, '#ffaa00');
                    }
                }, 1000);
            } else {
                mostrarNotificacao('⚠️ Bloqueado! Permita popups ou use o botão "Popup"', '#ff4444');
            }
        }

        // 2. Abrir em popup (mais compatível)
        function abrirPopup(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;

            const width = 420;
            const height = 700;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;

            const features =
                `width=${width},height=${height},left=${left},top=${top},menubar=no,toolbar=no,location=yes,status=no,scrollbars=yes,resizable=yes`;

            const popup = window.open(account.url, `popup_${id}`, features);

            if (popup) {
                account.status = 'online';
                account.window = popup;
                onlineCount++;
                atualizarStatus(id);
                atualizarStats();
                mostrarNotificacao(`📱 Popup: ${account.name}`, '#ff00ff');

                const checkPopup = setInterval(() => {
                    if (popup.closed) {
                        clearInterval(checkPopup);
                        account.status = 'offline';
                        account.window = null;
                        onlineCount--;
                        atualizarStatus(id);
                        atualizarStats();
                        mostrarNotificacao(`👋 Popup fechado: ${account.name}`, '#ffaa00');
                    }
                }, 1000);

                popup.focus();
            } else {
                mostrarNotificacao('⚠️ Popup bloqueado! Clique em "Abrir" para nova aba.', '#ff4444');
            }
        }

        // ============================================================
        // GERENCIAMENTO
        // ============================================================
        function atualizarStatus(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;

            const dot = document.getElementById(`dot_${id}`);
            const text = document.getElementById(`statusText_${id}`);

            if (dot && text) {
                dot.className = `dot ${account.status === 'online' ? 'online' : 'offline'}`;
                text.textContent = account.status === 'online' ? '🟢 Conectado' : '🔴 Desconectado';
            }
        }

        function removerConta(id) {
            const index = accounts.findIndex(a => a.id === id);
            if (index === -1) return;

            const account = accounts[index];

            // Fechar janela se estiver aberta
            if (account.window && !account.window.closed) {
                try {
                    account.window.close();
                } catch {}
                onlineCount--;
            }

            const card = document.querySelector(`.account-card[data-id="${id}"]`);
            if (card) {
                gsap.to(card, {
                    scale: 0.8,
                    opacity: 0,
                    duration: 0.4,
                    ease: 'power2.in',
                    onComplete: () => {
                        card.remove();
                        accounts.splice(index, 1);
                        atualizarStats();
                    }
                });
            }

            mostrarNotificacao(`🗑️ Removida: ${account.name}`, '#ff4444');
        }

        function criarMultiplas(quantidade) {
            const urls = [
                'https://www.instagram.com',
                'https://www.facebook.com',
                'https://twitter.com',
                'https://www.youtube.com',
                'https://www.tiktok.com',
                'https://www.linkedin.com',
                'https://web.whatsapp.com',
                'https://web.telegram.org',
                'https://www.reddit.com',
                'https://www.pinterest.com'
            ];

            const nomes = [
                'Instagram', 'Facebook', 'Twitter', 'YouTube', 'TikTok',
                'LinkedIn', 'WhatsApp', 'Telegram', 'Reddit', 'Pinterest'
            ];

            for (let i = 0; i < quantidade; i++) {
                const url = urls[Math.floor(Math.random() * urls.length)];
                const nome = nomes[Math.floor(Math.random() * nomes.length)];
                const num = Math.floor(Math.random() * 10000);

                criarConta({
                    name: `${nome} ${num}`,
                    url: url
                });
            }

            mostrarNotificacao(`📱 ${quantidade} contas criadas!`, '#00ffff');

            setTimeout(() => {
                const container = document.getElementById('accountsContainer');
                container.scrollTo({
                    top: container.scrollHeight,
                    behavior: 'smooth'
                });
            }, 300);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function abrirModal() {
            document.getElementById('modalOverlay').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('createAccountForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('accountName').value.trim();
            const network = document.getElementById('socialNetwork').value;
            const customUrl = document.getElementById('customUrl').value.trim();

            if (!name) {
                mostrarNotificacao('⚠️ Digite um nome!', '#ffaa00');
                return;
            }

            const url = customUrl || network;

            criarConta({ name, url });

            fecharModal();
            document.getElementById('createAccountForm').reset();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharModal();
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) fecharModal();
        });

        // ============================================================
        // STATS
        // ============================================================
        function atualizarStats() {
            document.getElementById('totalAccounts').textContent = accounts.length;
            document.getElementById('totalOnline').textContent = onlineCount;
        }

        // ============================================================
        // NOTIFICAÇÕES
        // ============================================================
        function mostrarNotificacao(mensagem, cor = '#00ffff') {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.borderColor = cor;
            notif.style.boxShadow = `0 0 40px rgba(0,0,0,0.8), 0 0 30px ${cor}40`;
            notif.innerHTML = mensagem;
            document.body.appendChild(notif);

            setTimeout(() => {
                notif.remove();
            }, 3200);
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        function init() {
            const exemplos = [
                { name: '📸 Instagram Pessoal', url: 'https://www.instagram.com' },
                { name: '👍 Facebook Business', url: 'https://www.facebook.com' },
                { name: '🐦 Twitter/X News', url: 'https://twitter.com' },
                { name: '▶️ YouTube Canal', url: 'https://www.youtube.com' },
                { name: '💼 LinkedIn Profissional', url: 'https://www.linkedin.com' },
                { name: '🎵 TikTok Criador', url: 'https://www.tiktok.com' }
            ];

            exemplos.forEach(ex => criarConta(ex));

            setTimeout(() => {
                mostrarNotificacao('🚀 Sistema carregado! Clique em "Abrir" para logar', '#00ffff');
            }, 1000);

            setTimeout(() => {
                mostrarNotificacao('💡 Dica: Use "Popup" para janela flutuante', '#ff00ff');
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', init);

        console.log('📱 SocialCell carregado!');
        console.log('🎯 Clique em "Abrir" ou "Popup" em cada conta');
        console.log('💡 Cada conta mantém sessão independente');
    </script>
</body>
</html>
