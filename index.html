<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialCell Pro - Navegador de Contas</title>
    
    <!-- Bibliotecas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            height: 70px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 100%;
            animation: neonLine 3s ease-in-out infinite;
        }

        @keyframes neonLine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(5deg); }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 3s ease-in-out infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            margin-right: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.1);
        }

        .stat-item span {
            color: #00ffff;
            font-weight: 700;
        }

        .btn-neon {
            padding: 8px 20px;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 8px;
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-neon:hover::before {
            left: 100%;
        }

        .btn-neon:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .btn-neon-purple {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-neon-purple:hover {
            background: #ff00ff;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.5);
        }

        /* ===== CONTAINER DE CELULARES ===== */
        .phones-container {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            display: flex;
            flex-wrap: nowrap;
            gap: 25px;
            overflow-x: auto;
            overflow-y: hidden;
            z-index: 1;
            align-items: flex-start;
            scroll-behavior: smooth;
        }

        .phones-container::-webkit-scrollbar {
            height: 8px;
        }

        .phones-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .phones-container::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 10px;
        }

        /* ===== CELULAR ===== */
        .phone-wrapper {
            flex: 0 0 auto;
            animation: fadeInUp 0.6s ease;
            transition: all 0.3s ease;
            position: relative;
        }

        .phone-wrapper:hover {
            transform: translateY(-5px) scale(1.02);
            z-index: 10;
        }

        .phone {
            width: 380px;
            height: 650px;
            background: #1a1a1a;
            border-radius: 40px;
            padding: 10px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, transparent, #ff00ff, transparent);
            background-size: 400% 400%;
            border-radius: 42px;
            z-index: -1;
            animation: neonPhone 4s ease-in-out infinite;
            opacity: 0.3;
            transition: opacity 0.4s ease;
        }

        .phone:hover::before {
            opacity: 1;
        }

        @keyframes neonPhone {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .phone-notch {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 22px;
            background: #0a0a0a;
            border-radius: 0 0 12px 12px;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .phone-notch .camera {
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #2a2a2a, #1a1a1a);
            border-radius: 50%;
            border: 1px solid #333;
        }

        .phone-notch .speaker {
            width: 35px;
            height: 3px;
            background: #2a2a2a;
            border-radius: 2px;
        }

        .phone-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 22px;
            height: 22px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            color: #ff4444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            z-index: 4;
            transition: all 0.3s ease;
        }

        .phone-close:hover {
            background: rgba(255, 0, 0, 0.4);
            transform: scale(1.1);
        }

        /* ===== TELA DO CELULAR (iframe) ===== */
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            background: #0a0a0a;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .phone-status-bar {
            position: absolute;
            top: 35px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            padding: 3px 8px;
            font-size: 0.65rem;
            color: #fff;
            z-index: 2;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        .phone-status-bar .time {
            font-weight: 700;
        }

        .phone-status-bar .icons {
            display: flex;
            gap: 4px;
        }

        /* ===== CONTROLES DO CELULAR ===== */
        .phone-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .phone-controls button {
            background: transparent;
            border: none;
            color: #fff;
            padding: 4px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
        }

        .phone-controls button:hover {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
        }

        .phone-controls .btn-back {
            color: #00ffff;
        }

        .phone-controls .btn-forward {
            color: #ff00ff;
        }

        .phone-controls .btn-refresh {
            color: #00ff88;
        }

        .phone-controls .btn-home {
            color: #ffaa00;
        }

        .phone-label {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: #666;
            font-family: 'Orbitron', monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 10px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            z-index: 2;
            white-space: nowrap;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #1a1a1a;
            padding: 35px;
            border-radius: 25px;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
            animation: modalSlide 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalSlide {
            from { transform: translateY(-50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-content h2 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content .form-group {
            margin-bottom: 15px;
        }

        .modal-content label {
            display: block;
            color: #888;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px 12px;
            background: #0a0a0a;
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .modal-content input:focus, .modal-content select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .modal-content .btn-group-modal {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-content .btn-group-modal button {
            flex: 1;
            padding: 10px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-content .btn-group-modal button:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .btn-close-modal {
            border-color: #ff4444 !important;
            color: #ff4444 !important;
        }

        .btn-close-modal:hover {
            background: #ff4444 !important;
            color: #fff !important;
        }

        /* ===== NOTIFICAÇÕES ===== */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffff;
            border-radius: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.4s ease, fadeOut 0.4s ease 2.8s forwards;
            max-width: 400px;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(50px); }
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 8px 15px;
                height: 60px;
                flex-wrap: wrap;
            }

            .logo-text {
                font-size: 1.1rem;
            }

            .header-stats {
                font-size: 0.7rem;
                gap: 8px;
            }

            .stat-item {
                padding: 3px 8px;
            }

            .header-controls .btn-neon {
                padding: 5px 12px;
                font-size: 0.6rem;
            }

            .phones-container {
                top: 60px;
                padding: 10px;
                gap: 15px;
            }

            .phone {
                width: 300px;
                height: 520px;
                border-radius: 30px;
            }

            .phone-screen {
                border-radius: 22px;
            }

            .phone-notch {
                width: 80px;
                height: 18px;
            }

            .phone-controls button {
                font-size: 0.6rem;
                padding: 3px 6px;
            }

            .phone-label {
                font-size: 0.5rem;
                bottom: 40px;
            }
        }

        @media (max-width: 480px) {
            .phone {
                width: 260px;
                height: 460px;
                border-radius: 25px;
            }

            .phone-screen {
                border-radius: 17px;
            }

            .phone-notch {
                width: 60px;
                height: 14px;
                top: 8px;
            }

            .phone-notch .speaker {
                width: 25px;
                height: 2px;
            }

            .phone-status-bar {
                font-size: 0.5rem;
                top: 28px;
                padding: 2px 6px;
            }
        }

        /* Animação de entrada */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Loading do iframe */
        .iframe-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .iframe-loading .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 255, 255, 0.1);
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Partículas -->
    <div id="particles-js"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00ffff"/>
                            <stop offset="50%" stop-color="#ff00ff"/>
                            <stop offset="100%" stop-color="#00ffff"/>
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGrad)" stroke-width="3">
                        <animate attributeName="stroke-dasharray" values="0 283; 283 0; 0 283" dur="3s" repeatCount="indefinite"/>
                    </circle>
                    <text x="50" y="60" font-family="Orbitron" font-size="35" font-weight="900" fill="url(#logoGrad)" text-anchor="middle" dominant-baseline="middle">S</text>
                    <circle cx="50" cy="50" r="25" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.5">
                        <animate attributeName="r" values="25; 40; 25" dur="2s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.5; 0; 0.5" dur="2s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </div>
            <div>
                <div class="logo-text">SocialCell</div>
                <div style="font-size: 0.6rem; color: #666; font-family: 'Orbitron', monospace; letter-spacing: 2px;">
                    <i class="fas fa-globe" style="color: #00ffff;"></i> NAVEGADOR MULTI-CONTA
                </div>
            </div>
        </div>
        <div class="header-controls">
            <div class="header-stats">
                <div class="stat-item">
                    <i class="fas fa-mobile-alt" style="color: #00ffff;"></i>
                    <span id="totalPhones">0</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-check-circle" style="color: #00ff88;"></i>
                    <span id="totalLoaded">0</span>
                </div>
            </div>
            <button class="btn-neon" onclick="abrirModal()">
                <i class="fas fa-plus-circle"></i> Nova
            </button>
            <button class="btn-neon btn-neon-purple" onclick="criarMultiplasTelas(10)">
                <i class="fas fa-layer-group"></i> +10
            </button>
            <button class="btn-neon" onclick="criarMultiplasTelas(50)" style="border-color: #00ff88; color: #00ff88;">
                <i class="fas fa-rocket"></i> +50
            </button>
        </div>
    </header>

    <!-- ===== CONTAINER DE CELULARES ===== -->
    <div class="phones-container" id="phonesContainer">
        <!-- Celulares serão inseridos aqui -->
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2><i class="fas fa-plus-circle" style="color: #ff00ff;"></i> Nova Conta</h2>
            <form id="createAccountForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nome da Conta</label>
                    <input type="text" id="accountName" placeholder="Ex: Minha Conta" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-globe"></i> URL da Rede Social</label>
                    <select id="socialNetwork">
                        <option value="https://www.instagram.com">Instagram</option>
                        <option value="https://www.facebook.com">Facebook</option>
                        <option value="https://twitter.com">Twitter / X</option>
                        <option value="https://www.youtube.com">YouTube</option>
                        <option value="https://www.tiktok.com">TikTok</option>
                        <option value="https://www.linkedin.com">LinkedIn</option>
                        <option value="https://web.whatsapp.com">WhatsApp Web</option>
                        <option value="https://web.telegram.org">Telegram Web</option>
                        <option value="https://www.reddit.com">Reddit</option>
                        <option value="https://www.pinterest.com">Pinterest</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-link"></i> URL Personalizada</label>
                    <input type="url" id="customUrl" placeholder="https://exemplo.com">
                    <small style="color: #666; font-size: 0.75rem;">Deixe em branco para usar a rede selecionada</small>
                </div>
                <div class="btn-group-modal">
                    <button type="submit">
                        <i class="fas fa-check"></i> Criar Tela
                    </button>
                    <button type="button" class="btn-close-modal" onclick="fecharModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // PARTÍCULAS
        // ============================================================
        particlesJS('particles-js', {
            particles: {
                number: { value: 50, density: { enable: true, value_area: 800 } },
                color: { value: ['#00ffff', '#ff00ff'] },
                shape: { type: 'circle' },
                opacity: { value: 0.4, random: true },
                size: { value: 2, random: true },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#00ffff',
                    opacity: 0.1,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1.2,
                    direction: 'none',
                    random: true,
                    out_mode: 'out'
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: { enable: true, mode: 'repulse' },
                    onclick: { enable: true, mode: 'push' }
                }
            }
        });

        // ============================================================
        // ESTADO DO SISTEMA
        // ============================================================
        let phones = [];
        let phoneCounter = 0;
        let loadedCount = 0;

        const socialNetworks = {
            'instagram': 'https://www.instagram.com',
            'facebook': 'https://www.facebook.com',
            'twitter': 'https://twitter.com',
            'youtube': 'https://www.youtube.com',
            'tiktok': 'https://www.tiktok.com',
            'linkedin': 'https://www.linkedin.com',
            'whatsapp': 'https://web.whatsapp.com',
            'telegram': 'https://web.telegram.org',
            'reddit': 'https://www.reddit.com',
            'pinterest': 'https://www.pinterest.com'
        };

        // ============================================================
        // FUNÇÕES PRINCIPAIS
        // ============================================================
        function criarTela(accountData) {
            const id = ++phoneCounter;
            
            const phoneData = {
                id: id,
                name: accountData.name || `Conta ${id}`,
                url: accountData.url || 'https://www.google.com',
                createdAt: new Date().toLocaleString('pt-BR'),
                isLoaded: false
            };
            
            phones.push(phoneData);
            renderizarTela(phoneData);
            atualizarStats();
            
            // Animação
            gsap.from(`.phone-wrapper[data-id="${id}"]`, {
                scale: 0,
                rotation: -10,
                duration: 0.5,
                ease: 'back.out(1.7)'
            });
            
            mostrarNotificacao(`📱 Nova tela: ${phoneData.name}`, '#00ffff');
            
            return phoneData;
        }

        function renderizarTela(data) {
            const container = document.getElementById('phonesContainer');
            
            const wrapper = document.createElement('div');
            wrapper.className = 'phone-wrapper';
            wrapper.dataset.id = data.id;
            
            wrapper.innerHTML = `
                <div class="phone">
                    <button class="phone-close" onclick="removerTela(${data.id})" title="Remover">
                        <i class="fas fa-times"></i>
                    </button>
                    
                    <div class="phone-notch">
                        <div class="camera"></div>
                        <div class="speaker"></div>
                        <div class="camera"></div>
                    </div>
                    
                    <div class="phone-screen" id="screen_${data.id}">
                        <div class="phone-status-bar">
                            <span class="time">${new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}</span>
                            <span class="icons">
                                <i class="fas fa-signal"></i>
                                <i class="fas fa-wifi"></i>
                                <i class="fas fa-battery-three-quarters"></i>
                            </span>
                        </div>
                        
                        <div class="iframe-loading" id="loading_${data.id}">
                            <div class="spinner"></div>
                        </div>
                        
                        <iframe 
                            id="iframe_${data.id}" 
                            src="${data.url}"
                            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
                            loading="lazy"
                            onload="iframeCarregou(${data.id})"
                            onerror="iframeErro(${data.id})"
                        ></iframe>
                    </div>
                    
                    <div class="phone-label">${data.name}</div>
                    
                    <div class="phone-controls">
                        <button class="btn-back" onclick="navegar(${data.id}, 'back')">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                        <button class="btn-refresh" onclick="recarregar(${data.id})">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button class="btn-home" onclick="irParaHome(${data.id})">
                            <i class="fas fa-home"></i>
                        </button>
                        <button class="btn-forward" onclick="navegar(${data.id}, 'forward')">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        <button onclick="abrirDevTools(${data.id})" style="color: #ff00ff;">
                            <i class="fas fa-code"></i>
                        </button>
                    </div>
                </div>
            `;
            
            container.appendChild(wrapper);
            
            // Atualizar hora em tempo real
            setInterval(() => {
                const timeEl = wrapper.querySelector('.phone-status-bar .time');
                if (timeEl) {
                    timeEl.textContent = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
                }
            }, 10000);
        }

        function iframeCarregou(id) {
            const loading = document.getElementById(`loading_${id}`);
            if (loading) loading.style.display = 'none';
            
            const phone = phones.find(p => p.id === id);
            if (phone) {
                phone.isLoaded = true;
                loadedCount++;
                atualizarStats();
            }
            
            // Animação de sucesso
            gsap.from(`#screen_${id}`, {
                opacity: 0.5,
                duration: 0.3,
                ease: 'power2.out'
            });
        }

        function iframeErro(id) {
            const loading = document.getElementById(`loading_${id}`);
            if (loading) loading.style.display = 'none';
            
            mostrarNotificacao(`⚠️ Erro ao carregar: ${phones.find(p => p.id === id)?.name}`, '#ff4444');
        }

        function navegar(id, direcao) {
            const iframe = document.getElementById(`iframe_${id}`);
            if (!iframe) return;
            
            try {
                if (direcao === 'back') {
                    iframe.contentWindow.history.back();
                } else if (direcao === 'forward') {
                    iframe.contentWindow.history.forward();
                }
            } catch (e) {
                mostrarNotificacao('⚠️ Navegação não disponível', '#ffaa00');
            }
        }

        function recarregar(id) {
            const iframe = document.getElementById(`iframe_${id}`);
            if (!iframe) return;
            
            const loading = document.getElementById(`loading_${id}`);
            if (loading) loading.style.display = 'block';
            
            iframe.src = iframe.src;
            
            gsap.from(`#screen_${id}`, {
                scale: 0.95,
                duration: 0.3,
                ease: 'power2.out'
            });
        }

        function irParaHome(id) {
            const phone = phones.find(p => p.id === id);
            if (!phone) return;
            
            const iframe = document.getElementById(`iframe_${id}`);
            if (!iframe) return;
            
            const loading = document.getElementById(`loading_${id}`);
            if (loading) loading.style.display = 'block';
            
            // Extrair domínio base da URL atual
            try {
                const url = new URL(iframe.src);
                iframe.src = url.origin;
            } catch {
                iframe.src = phone.url;
            }
        }

        function abrirDevTools(id) {
            const iframe = document.getElementById(`iframe_${id}`);
            if (!iframe) return;
            
            try {
                // Abrir o console do iframe (funciona em alguns navegadores)
                iframe.contentWindow.console.log('📱 DevTools aberto para esta conta');
                mostrarNotificacao('🔧 DevTools ativado para esta tela', '#ff00ff');
            } catch {
                mostrarNotificacao('⚠️ DevTools não disponível para este site', '#ffaa00');
            }
        }

        function removerTela(id) {
            const index = phones.findIndex(p => p.id === id);
            if (index === -1) return;
            
            const phone = phones[index];
            if (phone.isLoaded) loadedCount--;
            
            const wrapper = document.querySelector(`.phone-wrapper[data-id="${id}"]`);
            if (wrapper) {
                gsap.to(wrapper, {
                    scale: 0,
                    rotation: 20,
                    opacity: 0,
                    duration: 0.4,
                    ease: 'power2.in',
                    onComplete: () => {
                        wrapper.remove();
                        phones.splice(index, 1);
                        atualizarStats();
                    }
                });
            }
        }

        function criarMultiplasTelas(quantidade) {
            const urls = Object.values(socialNetworks);
            
            for (let i = 0; i < quantidade; i++) {
                const url = urls[Math.floor(Math.random() * urls.length)];
                const num = Math.floor(Math.random() * 10000);
                
                criarTela({
                    name: `Conta ${i+1}`,
                    url: url
                });
            }
            
            mostrarNotificacao(`📱 ${quantidade} novas telas criadas!`, '#00ffff');
            
            // Scroll para o final
            setTimeout(() => {
                const container = document.getElementById('phonesContainer');
                container.scrollTo({
                    left: container.scrollWidth,
                    behavior: 'smooth'
                });
            }, 300);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function abrirModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('accountName').focus();
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('createAccountForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('accountName').value.trim();
            const network = document.getElementById('socialNetwork').value;
            const customUrl = document.getElementById('customUrl').value.trim();
            
            if (!name) {
                mostrarNotificacao('⚠️ Digite um nome para a conta!', '#ffaa00');
                return;
            }
            
            const url = customUrl || network;
            
            criarTela({
                name: name,
                url: url
            });
            
            fecharModal();
            document.getElementById('createAccountForm').reset();
        });

        // Fechar modal com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharModal();
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) fecharModal();
        });

        // ============================================================
        // STATS
        // ============================================================
        function atualizarStats() {
            document.getElementById('totalPhones').textContent = phones.length;
            document.getElementById('totalLoaded').textContent = loadedCount;
        }

        // ============================================================
        // NOTIFICAÇÕES
        // ============================================================
        function mostrarNotificacao(mensagem, cor = '#00ffff') {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.borderColor = cor;
            notif.style.boxShadow = `0 0 40px rgba(0,0,0,0.8), 0 0 30px ${cor}40`;
            notif.innerHTML = mensagem;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.remove();
            }, 3200);
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        function initSistema() {
            // Criar algumas telas iniciais
            const exemplos = [
                { name: 'Instagram Pessoal', url: 'https://www.instagram.com' },
                { name: 'Facebook Business', url: 'https://www.facebook.com' },
                { name: 'Twitter/X News', url: 'https://twitter.com' },
                { name: 'YouTube Canal', url: 'https://www.youtube.com' },
                { name: 'LinkedIn Profissional', url: 'https://www.linkedin.com' },
                { name: 'TikTok Criador', url: 'https://www.tiktok.com' }
            ];
            
            exemplos.forEach(ex => {
                criarTela(ex);
            });
            
            mostrarNotificacao('🚀 Sistema iniciado com 6 telas!', '#00ffff');
            
            // Dica de uso
            setTimeout(() => {
                mostrarNotificacao('💡 Faça login nas redes sociais em cada tela!', '#ff00ff');
            }, 2000);
        }

        document.addEventListener('DOMContentLoaded', initSistema);

        // ============================================================
        // CONTROLE DE CONSENTIMENTO PARA COOKIES
        // ============================================================
        // Os iframes com sandbox permitem que os sites funcionem normalmente
        // Mantendo a segurança do sistema

        console.log('📱 SocialCell Pro carregado!');
        console.log('🎯 Agora você pode fazer login REAL em cada tela!');
        console.log('💡 Cada tela é um navegador independente.');
        console.log('📊 Suporta centenas de telas simultaneamente.');
        console.log('🔐 Cada conta mantém seus cookies e sessão separados.');
    </script>
</body>
</html>
