<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Bots - Conversa Automática</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 25px;
            border: 2px solid #9146ff;
            box-shadow: 0 0 40px rgba(145, 70, 255, 0.2);
        }
        h1 {
            font-size: 2rem;
            text-align: center;
            color: #9146ff;
            margin-bottom: 20px;
        }
        .login-area {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #0f0f0f;
            border-radius: 15px;
            border: 1px solid #333;
        }
        .manual-token-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .manual-token-area input {
            flex: 1;
            min-width: 180px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
        }
        .manual-token-area input:focus {
            border-color: #9146ff;
            outline: none;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-twitch {
            background: #9146ff;
            color: #fff;
        }
        .btn-twitch:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(145, 70, 255, 0.5);
        }
        .btn-add {
            background: #00ff88;
            color: #0a0a0a;
        }
        .btn-add:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        .btn-danger:hover {
            transform: scale(1.05);
        }
        .btn-activate {
            background: #00ff88;
            color: #0a0a0a;
        }
        .btn-activate.active {
            background: #ff4444;
            color: #fff;
        }
        .config-area {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .config-area input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            flex: 1;
            min-width: 200px;
        }
        .config-area input:focus {
            border-color: #9146ff;
            outline: none;
        }
        .accounts-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .account-card {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            transition: 0.3s;
        }
        .account-card:hover {
            border-color: #9146ff;
        }
        .account-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .account-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #9146ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
        }
        .account-name {
            font-weight: bold;
            color: #ddd;
        }
        .account-status {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .status-online {
            background: #00ff8844;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .status-offline {
            background: #ff444444;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .account-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .account-actions .btn-activate {
            background: #00ff88;
            color: #0a0a0a;
        }
        .account-actions .btn-activate.active {
            background: #ff4444;
            color: #fff;
        }
        .account-actions .btn-remove {
            background: #ff4444;
            color: #fff;
            margin-left: 5px;
        }
        .log-area {
            margin-top: 20px;
            background: #0a0a0a;
            border-radius: 10px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: #aaa;
            border: 1px solid #333;
        }
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-entry.success {
            color: #00ff88;
        }
        .log-entry.error {
            color: #ff4444;
        }
        .log-entry.info {
            color: #66ccff;
        }
        .log-entry.chat {
            color: #ffaa00;
        }
        .log-entry.bot {
            color: #9146ff;
        }
        .log-entry.self {
            color: #00ff88;
        }
        .empty-message {
            color: #666;
            text-align: center;
            padding: 20px;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 0.8rem;
        }
        .small {
            font-size: 0.7rem;
            color: #888;
        }
        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .account-card {
                flex-direction: column;
                align-items: stretch;
            }
            .account-actions {
                display: flex;
                gap: 5px;
            }
            .account-actions button {
                flex: 1;
            }
            .manual-token-area input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Twitch Bots - Conversa Automática</h1>

    <div class="login-area">
        <div class="manual-token-area">
            <input type="text" id="manualTokenInput" placeholder="Token OAuth (ex: oauth:xxx)">
            <input type="text" id="manualUsernameInput" placeholder="Nome do bot">
            <button class="btn btn-add" id="addTokenBtn">➕ Adicionar Bot</button>
        </div>
        <div class="small">Gere tokens em <a href="https://twitchtokengenerator.com" target="_blank" style="color:#9146ff;">twitchtokengenerator.com</a> (Bot Chat Token)</div>
    </div>

    <div class="config-area">
        <input type="text" id="targetChannel" placeholder="Canal alvo (sem #)" value="lpxstreaming">
        <button class="btn btn-twitch" id="setChannelBtn" style="background:#333; color:#fff;">Definir Canal</button>
    </div>

    <div class="actions-bar">
        <button class="btn btn-twitch" id="activateAllBtn">🚀 Ativar Todos</button>
        <button class="btn btn-danger" id="deactivateAllBtn">⏹ Desativar Todos</button>
        <button class="btn" id="clearLogsBtn" style="background:#555; color:#fff;">🧹 Limpar Logs</button>
    </div>

    <div id="accountsContainer" class="accounts-list">
        <div class="empty-message">Nenhuma conta conectada. Adicione uma conta acima.</div>
    </div>

    <div id="logArea" class="log-area">
        <div class="log-entry info">🚀 Sistema pronto. Adicione contas e ative os bots.</div>
    </div>

    <div class="footer">
        <span id="liveStatus">🔴 Verificando status da live...</span>
    </div>
</div>

<script>
    // ================================================================
    // CONFIGURAÇÕES
    // ================================================================
    const TWITCH_IRC = 'wss://irc-ws.chat.twitch.tv:443';

    // ================================================================
    // ESTADO
    // ================================================================
    let accounts = {};
    let accountCounter = 0;
    let targetChannel = document.getElementById('targetChannel').value.trim() || 'lpxstreaming';
    let wsConnections = {};
    let liveActive = false;

    // ================================================================
    // LOGS
    // ================================================================
    function addLog(message, type = 'info', accountId = null) {
        const logArea = document.getElementById('logArea');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        let prefix = '';
        if (accountId && accounts[accountId]) {
            prefix = `[${accounts[accountId].username}] `;
        }
        entry.textContent = prefix + message;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
        if (logArea.children.length > 300) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    // ================================================================
    // ADICIONAR CONTA
    // ================================================================
    function addAccount(token, username) {
        token = token.trim();
        if (!token.startsWith('oauth:')) {
            token = 'oauth:' + token;
        }
        if (!token || !username) {
            addLog('⚠️ Preencha token e nome de usuário.', 'error');
            return;
        }
        const id = ++accountCounter;
        const personalidades = [
            { nome: 'Alegre', cor: '#ff6b6b', saudacoes: ['e aí galera!', 'opa!'] },
            { nome: 'Cínico', cor: '#ffd93d', saudacoes: ['hmm, interessante', 'é o que temos'] },
            { nome: 'Entusiasta', cor: '#6bcb77', saudacoes: ['que demais!', 'sensacional!'] },
            { nome: 'Perguntador', cor: '#4d96ff', saudacoes: ['alguém sabe?', 'como assim?'] }
        ];
        const persona = personalidades[Math.floor(Math.random() * personalidades.length)];
        accounts[id] = {
            token: token,
            username: username.trim(),
            persona: persona,
            status: 'offline',
            ws: null,
            interval: null,
            lastMessageTime: 0,
            userCooldowns: {},
            messageCount: 0
        };
        renderAccounts();
        addLog(`✅ Conta ${username} adicionada (${persona.nome})!`, 'success', id);
    }

    // ================================================================
    // REMOVER CONTA
    // ================================================================
    function removeAccount(id) {
        if (accounts[id].status === 'online') {
            deactivateBot(id);
        }
        delete accounts[id];
        renderAccounts();
        addLog(`🗑️ Conta removida.`, 'info');
    }

    // ================================================================
    // RENDERIZAR LISTA
    // ================================================================
    function renderAccounts() {
        const container = document.getElementById('accountsContainer');
        const ids = Object.keys(accounts);
        if (ids.length === 0) {
            container.innerHTML = `<div class="empty-message">Nenhuma conta conectada. Adicione uma conta acima.</div>`;
            return;
        }
        let html = '';
        ids.forEach(id => {
            const acc = accounts[id];
            const statusClass = acc.status === 'online' ? 'status-online' : 'status-offline';
            const statusText = acc.status === 'online' ? '🟢 Online' : '🔴 Offline';
            const btnText = acc.status === 'online' ? 'Desativar' : 'Ativar';
            const btnClass = acc.status === 'online' ? 'btn-activate active' : 'btn-activate';
            const avatarText = acc.username.substring(0, 2).toUpperCase();
            html += `
                <div class="account-card" data-id="${id}">
                    <div class="account-info">
                        <div class="account-avatar" style="background:${acc.persona.cor};">${avatarText}</div>
                        <div>
                            <div class="account-name">${acc.username}</div>
                            <span class="account-status ${statusClass}">${statusText}</span>
                            <span style="font-size:0.7rem; color:#888; margin-left:8px;">${acc.persona.nome}</span>
                        </div>
                    </div>
                    <div class="account-actions">
                        <button class="${btnClass}" onclick="toggleBot(${id})">${btnText}</button>
                        <button class="btn-remove" onclick="removeAccount(${id})">✕</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ================================================================
    // FUNÇÕES DE CONVERSÃO (BOT)
    // ================================================================
    function gerarResposta(mensagem, persona, username) {
        const respostas = {
            'Alegre': [
                "hahaha verdade! 😂", "isso é épico! 🔥", "alguém mais tá amando essa live?",
                "que jogada!", "melhor momento!", "hahaha que isso", "pois é, tô curtindo",
                "alguém mais viu isso? 👀", "sim, concordo!", "POGGERS!", "KEKW", "LUL",
                "monkaS", "caraca, que momento!", "sensacional!"
            ],
            'Cínico': [
                "hmm, interessante", "é o que temos", "não sei não hein", "cada um com sua opinião",
                "é, pode ser", "vai entender", "pois é", "faz sentido", "talvez", "vamos ver"
            ],
            'Entusiasta': [
                "que demais! 🔥", "sensacional!", "maravilhoso!", "arrasou!",
                "melhor coisa!", "eu amei!", "incrível!", "fantástico!",
                "top demais!", "show!"
            ],
            'Perguntador': [
                "alguém sabe?", "como assim?", "por que?", "onde isso?",
                "quando?", "quem?", "o que aconteceu?", "como funciona?",
                "alguém mais percebeu?", "será?"
            ]
        };
        const lista = respostas[persona.nome] || respostas['Alegre'];
        // Se for uma saudação, use uma das saudacoes
        if (mensagem.toLowerCase().includes('oi') || mensagem.toLowerCase().includes('olá')) {
            return persona.saudacoes[Math.floor(Math.random() * persona.saudacoes.length)];
        }
        return lista[Math.floor(Math.random() * lista.length)];
    }

    // ================================================================
    // ATIVAR BOT (WebSocket)
    // ================================================================
    function toggleBot(id) {
        const acc = accounts[id];
        if (!acc) return;
        if (acc.status === 'online') {
            deactivateBot(id);
        } else {
            activateBot(id);
        }
    }

    function activateBot(id) {
        const acc = accounts[id];
        if (!acc) return;
        const channel = targetChannel;
        if (!channel) {
            addLog('❌ Defina um canal alvo primeiro.', 'error', id);
            return;
        }
        if (acc.status === 'online') return;

        try {
            const ws = new WebSocket(TWITCH_IRC);
            acc.ws = ws;
            acc.status = 'connecting';
            renderAccounts();
            addLog(`🔄 Conectando ao chat...`, 'info', id);

            ws.onopen = () => {
                ws.send(`PASS ${acc.token}`);
                ws.send(`NICK ${acc.username}`);
                ws.send(`JOIN #${channel}`);
                addLog(`✅ Conectado ao canal #${channel}`, 'success', id);
                acc.status = 'online';
                renderAccounts();

                // Ping/pong
                const pingInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send('PING :tmi.twitch.tv');
                    }
                }, 30000);
                acc._pingInterval = pingInterval;

                // Comentários espontâneos (a cada 2 minutos)
                const spontaneousInterval = setInterval(() => {
                    if (acc.status !== 'online') {
                        clearInterval(spontaneousInterval);
                        return;
                    }
                    const frases = [
                        "essa live tá muito boa! 🔥",
                        "alguém mais animado pro próximo jogo?",
                        "melhor live do dia, com certeza",
                        "quanto tempo hein, tava com saudade",
                        "hahaha esse momento foi épico",
                        "alguém sabe dizer que horas termina?",
                        "que gameplay insana, parabéns!",
                        "estou amando a interação no chat",
                        "alguém mais curtiu essa parte?",
                        "não vejo a hora do próximo jogo"
                    ];
                    // Escolhe uma frase adaptada à personalidade
                    let frase = frases[Math.floor(Math.random() * frases.length)];
                    if (acc.persona.nome === 'Perguntador') {
                        frase = "alguém mais viu isso?" + (Math.random() > 0.5 ? " 👀" : "");
                    } else if (acc.persona.nome === 'Cínico') {
                        frase = "é... vamos ver o que vem por aí";
                    }
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(`PRIVMSG #${channel} :${frase}`);
                        addLog(`🗣️ ${frase}`, 'info', id);
                    }
                }, 120000);
                acc._spontaneousInterval = spontaneousInterval;

                // Verificar fim da live (a cada 30 segundos)
                if (!acc._liveCheckInterval) {
                    acc._liveCheckInterval = setInterval(() => {
                        verificarLive();
                    }, 30000);
                }
            };

            ws.onmessage = (event) => {
                const msg = event.data;
                // PING
                if (msg.startsWith('PING')) {
                    ws.send('PONG :tmi.twitch.tv');
                    return;
                }

                // Ignora mensagens do próprio bot
                if (msg.includes(`PRIVMSG #${channel} :`) && msg.includes(`:${acc.username}!`)) {
                    return;
                }

                // Parse de mensagem do chat
                const privmsgMatch = msg.match(/^:(\w+)!\w+@\w+\.tmi\.twitch\.tv PRIVMSG #(\w+) :(.+)$/);
                if (privmsgMatch) {
                    const username = privmsgMatch[1];
                    const channelName = privmsgMatch[2];
                    const message = privmsgMatch[3];
                    if (channelName.toLowerCase() === channel.toLowerCase()) {
                        addLog(`💬 ${username}: ${message}`, 'chat', id);

                        // CONVERSA ENTRE BOTS: se o usuário for outro bot (username de outra conta), responder com mais frequência (60%)
                        const isBot = Object.values(accounts).some(a => a.username === username && a.status === 'online');
                        const prob = isBot ? 0.6 : 0.25;

                        if (Math.random() < prob && !message.startsWith('!')) {
                            const now = Date.now();
                            if (acc.userCooldowns[username] && (now - acc.userCooldowns[username]) < 30000) return; // 30s entre respostas ao mesmo usuário
                            if ((now - acc.lastMessageTime) < 4000) return; // 4s global

                            const resposta = gerarResposta(message, acc.persona, username);
                            ws.send(`PRIVMSG #${channel} :${resposta}`);
                            acc.lastMessageTime = now;
                            acc.userCooldowns[username] = now;
                            acc.messageCount++;
                            addLog(`🤖 ${resposta}`, 'bot', id);
                        }
                    }
                }
            };

            ws.onclose = (e) => {
                if (acc.status === 'online') {
                    addLog(`⚠️ Conexão fechada. Tentando reconectar...`, 'error', id);
                    deactivateBot(id);
                    // Tentar reconectar após 5s se a live ainda estiver ativa
                    setTimeout(() => {
                        if (liveActive) {
                            activateBot(id);
                        }
                    }, 5000);
                }
            };

            ws.onerror = (err) => {
                addLog(`❌ Erro no WebSocket: ${err.message || 'erro'}`, 'error', id);
                if (acc.status === 'online') {
                    deactivateBot(id);
                }
            };

        } catch (e) {
            addLog(`❌ Erro: ${e.message}`, 'error', id);
        }
    }

    function deactivateBot(id) {
        const acc = accounts[id];
        if (!acc) return;
        if (acc.ws) {
            try {
                acc.ws.close();
            } catch (e) {}
            acc.ws = null;
        }
        if (acc._pingInterval) {
            clearInterval(acc._pingInterval);
            acc._pingInterval = null;
        }
        if (acc._spontaneousInterval) {
            clearInterval(acc._spontaneousInterval);
            acc._spontaneousInterval = null;
        }
        if (acc._liveCheckInterval) {
            clearInterval(acc._liveCheckInterval);
            acc._liveCheckInterval = null;
        }
        acc.status = 'offline';
        acc.lastMessageTime = 0;
        acc.userCooldowns = {};
        renderAccounts();
        addLog(`⏹️ Bot desativado.`, 'info', id);
    }

    // ================================================================
    // VERIFICAR LIVE
    // ================================================================
    async function verificarLive() {
        try {
            // Usa API pública da Twitch (sem autenticação) para verificar se a live está no ar
            const response = await fetch(`https://api.twitch.tv/helix/streams?user_login=${targetChannel}`, {
                headers: {
                    'Client-Id': 'kimne78kx3ncx6brgo4mv6gki5h1ko' // Client ID público da Twitch
                }
            });
            const data = await response.json();
            const isLive = data.data && data.data.length > 0;
            liveActive = isLive;
            document.getElementById('liveStatus').innerHTML = isLive ?
                `🟢 Live ativa no canal #${targetChannel}` :
                `🔴 Live encerrada ou offline. Os bots serão desativados.`;
            if (!isLive) {
                // Se a live acabou, desativa todos os bots
                Object.keys(accounts).forEach(id => {
                    if (accounts[id].status === 'online') {
                        deactivateBot(id);
                    }
                });
            }
        } catch (e) {
            // Se não conseguir verificar, assume que está ativa
            document.getElementById('liveStatus').innerHTML = `⚠️ Não foi possível verificar o status da live.`;
        }
    }

    // ================================================================
    // AÇÕES EM MASSA
    // ================================================================
    function activateAll() {
        Object.keys(accounts).forEach(id => {
            if (accounts[id].status !== 'online') {
                toggleBot(id);
            }
        });
    }

    function deactivateAll() {
        Object.keys(accounts).forEach(id => {
            if (accounts[id].status === 'online') {
                toggleBot(id);
            }
        });
    }

    // ================================================================
    // EVENTOS DOM
    // ================================================================

    document.getElementById('addTokenBtn').addEventListener('click', function() {
        const token = document.getElementById('manualTokenInput').value.trim();
        const username = document.getElementById('manualUsernameInput').value.trim();
        if (!token || !username) {
            addLog('⚠️ Preencha token e nome de usuário.', 'error');
            return;
        }
        addAccount(token, username);
        document.getElementById('manualTokenInput').value = '';
        document.getElementById('manualUsernameInput').value = '';
    });

    document.getElementById('setChannelBtn').addEventListener('click', function() {
        const input = document.getElementById('targetChannel');
        const val = input.value.trim();
        if (val) {
            targetChannel = val;
            localStorage.setItem('twitchBotChannel', val);
            addLog(`📡 Canal alvo definido para #${targetChannel}`, 'info');
            verificarLive();
        } else {
            addLog('⚠️ Digite um nome de canal válido.', 'error');
        }
    });

    document.getElementById('activateAllBtn').addEventListener('click', activateAll);
    document.getElementById('deactivateAllBtn').addEventListener('click', deactivateAll);

    document.getElementById('clearLogsBtn').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('logArea').innerHTML = '';
        addLog('🧹 Logs limpos.', 'info');
    });

    // ================================================================
    // CARREGAR CANAL SALVO E INICIAR VERIFICAÇÃO
    // ================================================================
    const savedChannel = localStorage.getItem('twitchBotChannel');
    if (savedChannel) {
        document.getElementById('targetChannel').value = savedChannel;
        targetChannel = savedChannel;
        addLog(`📡 Canal carregado: #${targetChannel}`, 'info');
    }

    // Verificação inicial da live
    setTimeout(() => {
        verificarLive();
    }, 2000);

    // Verificar a cada 60 segundos
    setInterval(verificarLive, 60000);

    // ================================================================
    // EXPOR FUNÇÕES GLOBAIS
    // ================================================================
    window.toggleBot = toggleBot;
    window.removeAccount = removeAccount;
    window.addAccount = addAccount;
    window.addLog = addLog;
    window.activateAll = activateAll;
