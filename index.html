<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialCell Pro - Gerenciador Multi-Conta</title>
    
    <!-- Bibliotecas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            height: 60px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 100%;
            animation: neonLine 3s ease-in-out infinite;
        }

        @keyframes neonLine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(5deg); }
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 3s ease-in-out infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-stats {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            margin-right: 10px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.1);
        }

        .stat-item span {
            color: #00ffff;
            font-weight: 700;
        }

        .btn-neon {
            padding: 6px 15px;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 8px;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-neon:hover::before {
            left: 100%;
        }

        .btn-neon:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .btn-neon-purple {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-neon-purple:hover {
            background: #ff00ff;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.5);
        }

        .btn-neon-green {
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-neon-green:hover {
            background: #00ff88;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
        }

        /* ===== CONTAINER ===== */
        .accounts-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            align-content: flex-start;
        }

        .accounts-container::-webkit-scrollbar {
            width: 8px;
        }

        .accounts-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .accounts-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 10px;
        }

        /* ===== CARD DE CONTA ===== */
        .account-card {
            flex: 0 0 calc(25% - 15px);
            min-width: 280px;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            border: 2px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
            transition: all 0.4s ease;
            animation: fadeInUp 0.5s ease;
            position: relative;
            min-height: 200px;
        }

        .account-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.15);
        }

        .account-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, transparent, #ff00ff, transparent);
            background-size: 400% 400%;
            border-radius: 22px;
            z-index: -1;
            animation: neonCard 4s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .account-card:hover::before {
            opacity: 0.5;
        }

        @keyframes neonCard {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header do Card */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-header .account-name {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: #00ffff;
            font-weight: 700;
        }

        .card-header .account-id {
            font-size: 0.6rem;
            color: #666;
            font-family: 'Orbitron', monospace;
        }

        .card-actions {
            display: flex;
            gap: 5px;
        }

        .card-actions button {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .card-actions button:hover {
            color: #ff4444;
            background: rgba(255, 0, 0, 0.1);
        }

        /* Info da Conta */
        .account-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .account-info .url-display {
            font-size: 0.75rem;
            color: #888;
            font-family: 'Rajdhani', sans-serif;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .account-info .url-display i {
            color: #00ffff;
            margin-right: 5px;
        }

        .account-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #666;
        }

        .account-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .account-status .dot.online {
            background: #00ff88;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .account-status .dot.offline {
            background: #ff4444;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* Botões de Ação */
        .account-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .account-buttons button {
            flex: 1;
            min-width: 60px;
            padding: 8px 12px;
            border: 2px solid #00ffff;
            border-radius: 10px;
            background: transparent;
            color: #00ffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .account-buttons button:hover {
            background: #00ffff;
            color: #0a0a0a;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .account-buttons .btn-login {
            border-color: #00ff88;
            color: #00ff88;
        }

        .account-buttons .btn-login:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        .account-buttons .btn-popup {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .account-buttons .btn-popup:hover {
            background: #ff00ff;
            color: #0a0a0a;
        }

        .account-buttons .btn-newtab {
            border-color: #ffaa00;
            color: #ffaa00;
        }

        .account-buttons .btn-newtab:hover {
            background: #ffaa00;
            color: #0a0a0a;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 25px;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
            animation: modalSlide 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalSlide {
            from { transform: translateY(-50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-content h2 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
        }

        .modal-content .form-group {
            margin-bottom: 15px;
        }

        .modal-content label {
            display: block;
            color: #888;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px 12px;
            background: #0a0a0a;
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .modal-content input:focus, .modal-content select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .modal-content .btn-group-modal {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-content .btn-group-modal button {
            flex: 1;
            padding: 10px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-content .btn-group-modal button:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .btn-close-modal {
            border-color: #ff4444 !important;
            color: #ff4444 !important;
        }

        .btn-close-modal:hover {
            background: #ff4444 !important;
            color: #fff !important;
        }

        /* ===== NOTIFICAÇÕES ===== */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffff;
            border-radius: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.4s ease, fadeOut 0.4s ease 3s forwards;
            max-width: 400px;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(50px); }
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 1200px) {
            .account-card {
                flex: 0 0 calc(33.33% - 15px);
            }
        }

        @media (max-width: 900px) {
            .account-card {
                flex: 0 0 calc(50% - 15px);
            }
        }

        @media (max-width: 600px) {
            .account-card {
                flex: 0 0 100%;
            }

            .header {
                padding: 5px 10px;
                height: 50px;
                flex-wrap: wrap;
                gap: 5px;
            }

            .logo-text {
                font-size: 1rem;
            }

            .header-stats {
                font-size: 0.65rem;
                gap: 5px;
            }

            .stat-item {
                padding: 2px 6px;
            }

            .btn-neon {
                padding: 4px 10px;
                font-size: 0.6rem;
            }

            .accounts-container {
                top: 50px;
                padding: 10px;
            }
        }

        /* Dica flutuante */
        .floating-tip {
            position: fixed;
            bottom: 80px;
            right: 30px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 0.8rem;
            color: #888;
            backdrop-filter: blur(10px);
            z-index: 50;
            max-width: 250px;
            animation: floatTip 3s ease-in-out infinite;
        }

        @keyframes floatTip {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .floating-tip strong {
            color: #00ffff;
        }
    </style>
</head>
<body>

    <!-- Partículas -->
    <div id="particles-js"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00ffff"/>
                            <stop offset="50%" stop-color="#ff00ff"/>
                            <stop offset="100%" stop-color="#00ffff"/>
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGrad)" stroke-width="3">
                        <animate attributeName="stroke-dasharray" values="0 283; 283 0; 0 283" dur="3s" repeatCount="indefinite"/>
                    </circle>
                    <text x="50" y="60" font-family="Orbitron" font-size="35" font-weight="900" fill="url(#logoGrad)" text-anchor="middle" dominant-baseline="middle">S</text>
                    <circle cx="50" cy="50" r="25" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.5">
                        <animate attributeName="r" values="25; 40; 25" dur="2s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.5; 0; 0.5" dur="2s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </div>
            <div>
                <div class="logo-text">SocialCell</div>
                <div style="font-size: 0.55rem; color: #666; font-family: 'Orbitron', monospace; letter-spacing: 1px;">
                    <i class="fas fa-window-restore" style="color: #00ffff;"></i> MULTI-CONTA
                </div>
            </div>
        </div>
        <div class="header-controls">
            <div class="header-stats">
                <div class="stat-item">
                    <i class="fas fa-users" style="color: #00ffff;"></i>
                    <span id="totalAccounts">0</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-window-maximize" style="color: #00ff88;"></i>
                    <span id="totalWindows">0</span>
                </div>
            </div>
            <button class="btn-neon" onclick="abrirModal()">
                <i class="fas fa-plus-circle"></i> Nova
            </button>
            <button class="btn-neon btn-neon-purple" onclick="criarMultiplasContas(10)">
                <i class="fas fa-layer-group"></i> +10
            </button>
            <button class="btn-neon btn-neon-green" onclick="criarMultiplasContas(50)">
                <i class="fas fa-rocket"></i> +50
            </button>
        </div>
    </header>

    <!-- ===== CONTAINER DE CONTAS ===== -->
    <div class="accounts-container" id="accountsContainer">
        <!-- Contas serão inseridas aqui -->
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2><i class="fas fa-plus-circle" style="color: #ff00ff;"></i> Nova Conta</h2>
            <form id="createAccountForm">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Nome da Conta</label>
                    <input type="text" id="accountName" placeholder="Ex: Instagram Pessoal" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-globe"></i> Rede Social</label>
                    <select id="socialNetwork">
                        <option value="https://www.instagram.com">Instagram</option>
                        <option value="https://www.facebook.com">Facebook</option>
                        <option value="https://twitter.com">Twitter / X</option>
                        <option value="https://www.youtube.com">YouTube</option>
                        <option value="https://www.tiktok.com">TikTok</option>
                        <option value="https://www.linkedin.com">LinkedIn</option>
                        <option value="https://web.whatsapp.com">WhatsApp Web</option>
                        <option value="https://web.telegram.org">Telegram Web</option>
                        <option value="https://www.reddit.com">Reddit</option>
                        <option value="https://www.pinterest.com">Pinterest</option>
                        <option value="https://www.twitch.tv">Twitch</option>
                        <option value="https://www.snapchat.com">Snapchat</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-link"></i> URL Personalizada</label>
                    <input type="url" id="customUrl" placeholder="https://exemplo.com">
                    <small style="color: #666; font-size: 0.7rem;">Deixe em branco para usar a rede selecionada</small>
                </div>
                <div class="btn-group-modal">
                    <button type="submit">
                        <i class="fas fa-check"></i> Criar
                    </button>
                    <button type="button" class="btn-close-modal" onclick="fecharModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dica Flutuante -->
    <div class="floating-tip">
        <i class="fas fa-lightbulb" style="color: #ffaa00;"></i>
        <strong>Dica:</strong> Clique em <strong>"Abrir Popup"</strong> para logar,
        ou <strong>"Nova Janela"</strong> para navegar normalmente!
    </div>

    <script>
        // ============================================================
        // PARTÍCULAS
        // ============================================================
        particlesJS('particles-js', {
            particles: {
                number: { value: 40, density: { enable: true, value_area: 800 } },
                color: { value: ['#00ffff', '#ff00ff'] },
                shape: { type: 'circle' },
                opacity: { value: 0.3, random: true },
                size: { value: 2, random: true },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#00ffff',
                    opacity: 0.1,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1,
                    direction: 'none',
                    random: true,
                    out_mode: 'out'
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: { enable: true, mode: 'repulse' },
                    onclick: { enable: true, mode: 'push' }
                }
            }
        });

        // ============================================================
        // ESTADO DO SISTEMA
        // ============================================================
        let accounts = [];
        let accountCounter = 0;
        let windowsOpen = 0;
        let popupsOpen = [];

        const socialNetworks = {
            'instagram': 'https://www.instagram.com',
            'facebook': 'https://www.facebook.com',
            'twitter': 'https://twitter.com',
            'youtube': 'https://www.youtube.com',
            'tiktok': 'https://www.tiktok.com',
            'linkedin': 'https://www.linkedin.com',
            'whatsapp': 'https://web.whatsapp.com',
            'telegram': 'https://web.telegram.org',
            'reddit': 'https://www.reddit.com',
            'pinterest': 'https://www.pinterest.com',
            'twitch': 'https://www.twitch.tv',
            'snapchat': 'https://www.snapchat.com'
        };

        // ============================================================
        // FUNÇÕES PRINCIPAIS
        // ============================================================
        function criarConta(accountData) {
            const id = ++accountCounter;
            
            const account = {
                id: id,
                name: accountData.name || `Conta ${id}`,
                url: accountData.url || 'https://www.google.com',
                createdAt: new Date().toLocaleString('pt-BR'),
                status: 'offline'
            };
            
            accounts.push(account);
            renderizarConta(account);
            atualizarStats();
            
            // Animação
            gsap.from(`.account-card[data-id="${id}"]`, {
                scale: 0.8,
                opacity: 0,
                rotation: -5,
                duration: 0.5,
                ease: 'back.out(1.7)'
            });
            
            mostrarNotificacao(`✅ Conta criada: ${account.name}`, '#00ffff');
            
            return account;
        }

        function renderizarConta(data) {
            const container = document.getElementById('accountsContainer');
            
            const card = document.createElement('div');
            card.className = 'account-card';
            card.dataset.id = data.id;
            
            const urlDisplay = data.url.length > 40 ? data.url.substring(0, 40) + '...' : data.url;
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="account-name">
                        <i class="fas fa-user-circle" style="color: #ff00ff;"></i>
                        ${data.name}
                    </span>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="account-id">#${data.id}</span>
                        <div class="card-actions">
                            <button onclick="removerConta(${data.id})" title="Remover">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="account-info">
                    <div class="url-display">
                        <i class="fas fa-link"></i>
                        ${urlDisplay}
                    </div>
                    <div class="account-status">
                        <span class="dot ${data.status === 'online' ? 'online' : 'offline'}" id="dot_${data.id}"></span>
                        <span id="statusText_${data.id}">${data.status === 'online' ? 'Conectado' : 'Desconectado'}</span>
                        <span style="margin-left: auto; font-size: 0.6rem; color: #444;">
                            <i class="far fa-clock"></i> ${data.createdAt}
                        </span>
                    </div>
                </div>
                
                <div class="account-buttons">
                    <button class="btn-login" onclick="abrirPopup(${data.id})">
                        <i class="fas fa-window-restore"></i> Popup
                    </button>
                    <button class="btn-popup" onclick="abrirJanela(${data.id})">
                        <i class="fas fa-external-link-alt"></i> Nova Janela
                    </button>
                    <button class="btn-newtab" onclick="abrirAba(${data.id})">
                        <i class="fas fa-plus-square"></i> Nova Aba
                    </button>
                </div>
            `;
            
            container.appendChild(card);
        }

        // ============================================================
        // MÉTODOS DE ABERTURA
        // ============================================================
        
        // 1. POPUP (janela flutuante estilo celular)
        function abrirPopup(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;
            
            // Características do popup estilo celular
            const width = 420;
            const height = 720;
            const left = (window.screen.width - width) / 2 + (popupsOpen.length * 30);
            const top = (window.screen.height - height) / 2 + (popupsOpen.length * 20);
            
            const features = [
                `width=${width}`,
                `height=${height}`,
                `left=${left}`,
                `top=${top}`,
                'menubar=no',
                'toolbar=no',
                'location=yes',
                'status=no',
                'scrollbars=yes',
                'resizable=yes'
            ].join(',');
            
            const popup = window.open(account.url, `account_${id}`, features);
            
            if (popup) {
                popupsOpen.push({ id: id, window: popup });
                windowsOpen++;
                account.status = 'online';
                atualizarStatus(id);
                atualizarStats();
                
                mostrarNotificacao(`📱 Popup aberto: ${account.name}`, '#00ff88');
                
                // Monitorar fechamento do popup
                const checkPopup = setInterval(() => {
                    if (popup.closed) {
                        clearInterval(checkPopup);
                        const index = popupsOpen.findIndex(p => p.id === id);
                        if (index !== -1) {
                            popupsOpen.splice(index, 1);
                            windowsOpen--;
                            account.status = 'offline';
                            atualizarStatus(id);
                            atualizarStats();
                            mostrarNotificacao(`👋 Popup fechado: ${account.name}`, '#ffaa00');
                        }
                    }
                }, 1000);
                
                // Focar o popup
                popup.focus();
            } else {
                mostrarNotificacao('⚠️ Popup bloqueado! Permita popups neste site.', '#ff4444');
            }
        }

        // 2. NOVA JANELA COMPLETA
        function abrirJanela(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;
            
            const win = window.open(account.url, `_blank`);
            if (win) {
                windowsOpen++;
                account.status = 'online';
                atualizarStatus(id);
                atualizarStats();
                mostrarNotificacao(`🪟 Nova janela: ${account.name}`, '#ff00ff');
                
                // Monitorar fechamento
                const checkWin = setInterval(() => {
                    if (win.closed) {
                        clearInterval(checkWin);
                        windowsOpen--;
                        account.status = 'offline';
                        atualizarStatus(id);
                        atualizarStats();
                    }
                }, 1000);
            } else {
                mostrarNotificacao('⚠️ Janela bloqueada! Permita popups.', '#ff4444');
            }
        }

        // 3. NOVA ABA
        function abrirAba(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;
            
            const win = window.open(account.url, `_blank`);
            if (win) {
                windowsOpen++;
                account.status = 'online';
                atualizarStatus(id);
                atualizarStats();
                mostrarNotificacao(`📑 Nova aba: ${account.name}`, '#ffaa00');
            } else {
                mostrarNotificacao('⚠️ Aba bloqueada! Permita popups.', '#ff4444');
            }
        }

        // ============================================================
        // GERENCIAMENTO
        // ============================================================
        function atualizarStatus(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;
            
            const dot = document.getElementById(`dot_${id}`);
            const text = document.getElementById(`statusText_${id}`);
            
            if (dot && text) {
                dot.className = `dot ${account.status === 'online' ? 'online' : 'offline'}`;
                text.textContent = account.status === 'online' ? 'Conectado' : 'Desconectado';
            }
        }

        function removerConta(id) {
            const index = accounts.findIndex(a => a.id === id);
            if (index === -1) return;
            
            // Fechar popup se estiver aberto
            const popupIndex = popupsOpen.findIndex(p => p.id === id);
            if (popupIndex !== -1) {
                try {
                    popupsOpen[popupIndex].window.close();
                } catch {}
                popupsOpen.splice(popupIndex, 1);
                windowsOpen--;
            }
            
            const card = document.querySelector(`.account-card[data-id="${id}"]`);
            if (card) {
                gsap.to(card, {
                    scale: 0.8,
                    opacity: 0,
                    rotation: 10,
                    duration: 0.4,
                    ease: 'power2.in',
                    onComplete: () => {
                        card.remove();
                        accounts.splice(index, 1);
                        atualizarStats();
                    }
                });
            }
            
            mostrarNotificacao(`🗑️ Conta removida: ${accounts[index]?.name || id}`, '#ff4444');
        }

        function criarMultiplasContas(quantidade) {
            const urls = Object.values(socialNetworks);
            const names = [
                'Instagram', 'Facebook', 'Twitter', 'YouTube', 'TikTok',
                'LinkedIn', 'WhatsApp', 'Telegram', 'Reddit', 'Pinterest',
                'Twitch', 'Snapchat', 'Spotify', 'Discord', 'GitHub'
            ];
            
            for (let i = 0; i < quantidade; i++) {
                const url = urls[Math.floor(Math.random() * urls.length)];
                const name = names[Math.floor(Math.random() * names.length)];
                const num = Math.floor(Math.random() * 10000);
                
                criarConta({
                    name: `${name} ${num}`,
                    url: url
                });
            }
            
            mostrarNotificacao(`📱 ${quantidade} contas criadas com sucesso!`, '#00ffff');
            
            // Scroll para o final
            setTimeout(() => {
                const container = document.getElementById('accountsContainer');
                container.scrollTo({
                    top: container.scrollHeight,
                    behavior: 'smooth'
                });
            }, 300);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function abrirModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('accountName').focus();
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('createAccountForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('accountName').value.trim();
            const network = document.getElementById('socialNetwork').value;
            const customUrl = document.getElementById('customUrl').value.trim();
            
            if (!name) {
                mostrarNotificacao('⚠️ Digite um nome para a conta!', '#ffaa00');
                return;
            }
            
            const url = customUrl || network;
            
            criarConta({
                name: name,
                url: url
            });
            
            fecharModal();
            document.getElementById('createAccountForm').reset();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharModal();
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) fecharModal();
        });

        // ============================================================
        // STATS
        // ============================================================
        function atualizarStats() {
            document.getElementById('totalAccounts').textContent = accounts.length;
            document.getElementById('totalWindows').textContent = windowsOpen;
        }

        // ============================================================
        // NOTIFICAÇÕES
        // ============================================================
        function mostrarNotificacao(mensagem, cor = '#00ffff') {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.borderColor = cor;
            notif.style.boxShadow = `0 0 40px rgba(0,0,0,0.8), 0 0 30px ${cor}40`;
            notif.innerHTML = mensagem;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.remove();
            }, 3200);
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        function initSistema() {
            const exemplos = [
                { name: 'Instagram Pessoal', url: 'https://www.instagram.com' },
                { name: 'Facebook Business', url: 'https://www.facebook.com' },
                { name: 'Twitter/X News', url: 'https://twitter.com' },
                { name: 'YouTube Canal', url: 'https://www.youtube.com' },
                { name: 'LinkedIn Profissional', url: 'https://www.linkedin.com' },
                { name: 'TikTok Criador', url: 'https://www.tiktok.com' }
            ];
            
            exemplos.forEach(ex => {
                criarConta(ex);
            });
            
            setTimeout(() => {
                mostrarNotificacao('🚀 Sistema iniciado! Clique em "Popup" para logar', '#00ffff');
            }, 1000);
            
            setTimeout(() => {
                mostrarNotificacao('💡 Popup abre estilo celular para login fácil!', '#ff00ff');
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', initSistema);

        console.log('📱 SocialCell Pro v2.0 carregado!');
        console.log('🎯 3 formas de abrir cada conta:');
        console.log('   1. Popup (estilo celular)');
        console.log('   2. Nova Janela (navegador completo)');
        console.log('   3. Nova Aba (navegação normal)');
        console.log('💡 Cada conta mantém sessão e cookies separados!');
        console.log(`📊 Suporta ${Object.keys(socialNetworks).length} redes sociais diferentes`);
    </script>
</body>
</html>
