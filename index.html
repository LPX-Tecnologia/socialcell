<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialCell - Gerenciador de Contas</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(20, 20, 20, 0.95);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 25px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            margin-right: 10px;
        }

        .stats span {
            color: #00ffff;
            font-weight: 700;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn-purple {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-purple:hover {
            background: #ff00ff;
            color: #0a0a0a;
        }

        .btn-green {
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-green:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        /* ===== CONTAINER DE CONTAS ===== */
        .accounts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
            min-height: 400px;
        }

        /* ===== CARD DE CONTA ===== */
        .account-card {
            flex: 0 0 calc(25% - 20px);
            min-width: 280px;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(0, 255, 255, 0.15);
            transition: all 0.3s ease;
            position: relative;
            animation: fadeIn 0.5s ease;
        }

        .account-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.15);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-name {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: #00ffff;
            font-weight: 700;
        }

        .card-id {
            font-size: 0.6rem;
            color: #666;
        }

        .card-url {
            font-size: 0.75rem;
            color: #888;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-url i {
            color: #00ffff;
            margin-right: 8px;
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.online {
            background: #00ff88;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .dot.offline {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .card-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card-buttons button {
            flex: 1;
            padding: 10px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-width: 60px;
        }

        .card-buttons button:hover {
            background: #00ffff;
            color: #0a0a0a;
            transform: scale(1.05);
        }

        .btn-open {
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-open:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        .btn-popup {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-popup:hover {
            background: #ff00ff;
            color: #0a0a0a;
        }

        .btn-remove {
            border-color: #ff4444;
            color: #ff4444;
            flex: 0.5 !important;
            min-width: 40px !important;
        }

        .btn-remove:hover {
            background: #ff4444;
            color: #0a0a0a;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(0, 255, 255, 0.2);
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .modal-box h2 {
            font-family: 'Orbitron', monospace;
            color: #00ffff;
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0a0a0a;
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .modal-box input:focus,
        .modal-box select:focus {
            outline: none;
            border-color: #00ffff;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            background: transparent;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .modal-buttons button:hover {
            background: #00ffff;
            color: #0a0a0a;
        }

        .modal-close {
            border-color: #ff4444 !important;
            color: #ff4444 !important;
        }

        .modal-close:hover {
            background: #ff4444 !important;
            color: #fff !important;
        }

        /* ===== NOTIFICAÇÃO ===== */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffff;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            animation: slideRight 0.4s ease, fadeOut 0.4s ease 3s forwards;
            max-width: 400px;
        }

        @keyframes slideRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(50px); }
        }

        /* ===== SEM CONTAS ===== */
        .empty-state {
            width: 100%;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 4rem;
            color: #333;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            color: #444;
            margin-bottom: 10px;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 1200px) {
            .account-card {
                flex: 0 0 calc(33.33% - 20px);
            }
        }

        @media (max-width: 900px) {
            .account-card {
                flex: 0 0 calc(50% - 20px);
            }
        }

        @media (max-width: 600px) {
            .account-card {
                flex: 0 0 100%;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-controls {
                justify-content: center;
            }

            .stats {
                justify-content: center;
            }

            .logo {
                text-align: center;
                font-size: 1.4rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="logo">
            📱 SocialCell
            <span style="font-size: 0.6rem; display: block; color: #666; -webkit-text-fill-color: #666;">
                <i class="fas fa-users"></i> Gerenciador Multi-Conta
            </span>
        </div>
        <div class="header-controls">
            <div class="stats">
                <div>
                    <i class="fas fa-users" style="color: #00ffff;"></i>
                    Total: <span id="totalAccounts">0</span>
                </div>
                <div>
                    <i class="fas fa-check-circle" style="color: #00ff88;"></i>
                    Online: <span id="totalOnline">0</span>
                </div>
            </div>
            <button class="btn" onclick="abrirModal()">
                <i class="fas fa-plus-circle"></i> Nova
            </button>
            <button class="btn btn-purple" onclick="criarMultiplas(10)">
                <i class="fas fa-layer-group"></i> +10
            </button>
            <button class="btn btn-green" onclick="criarMultiplas(50)">
                <i class="fas fa-rocket"></i> +50
            </button>
        </div>
    </div>

    <!-- ===== CONTAINER DE CONTAS ===== -->
    <div class="accounts-container" id="accountsContainer">
        <!-- As contas aparecerão aqui -->
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <h2><i class="fas fa-plus-circle" style="color: #ff00ff;"></i> Nova Conta</h2>
            <form id="formConta">
                <input type="text" id="nomeConta" placeholder="Nome da conta (ex: Instagram Pessoal)" required>
                
                <select id="redeSocial">
                    <option value="https://www.instagram.com">📸 Instagram</option>
                    <option value="https://www.facebook.com">👍 Facebook</option>
                    <option value="https://twitter.com">🐦 Twitter/X</option>
                    <option value="https://www.youtube.com">▶️ YouTube</option>
                    <option value="https://www.tiktok.com">🎵 TikTok</option>
                    <option value="https://www.linkedin.com">💼 LinkedIn</option>
                    <option value="https://web.whatsapp.com">💬 WhatsApp Web</option>
                    <option value="https://web.telegram.org">✈️ Telegram</option>
                    <option value="https://www.reddit.com">🤖 Reddit</option>
                    <option value="https://www.pinterest.com">📌 Pinterest</option>
                </select>
                
                <input type="url" id="urlPersonalizada" placeholder="URL personalizada (opcional)">
                
                <div class="modal-buttons">
                    <button type="submit">
                        <i class="fas fa-check"></i> Criar
                    </button>
                    <button type="button" class="modal-close" onclick="fecharModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // DADOS
        // ============================================================
        let contas = [];
        let contador = 0;
        let onlineCount = 0;

        // ============================================================
        // FUNÇÕES
        // ============================================================

        // Criar uma nova conta
        function criarConta(dados) {
            const id = ++contador;

            const conta = {
                id: id,
                nome: dados.nome || `Conta ${id}`,
                url: dados.url || 'https://www.google.com',
                status: 'offline',
                janela: null,
                criadoEm: new Date().toLocaleString('pt-BR')
            };

            contas.push(conta);
            renderizarConta(conta);
            atualizarStats();

            notificar(`✅ Conta criada: ${conta.nome}`, '#00ffff');

            return conta;
        }

        // Renderizar uma conta na tela
        function renderizarConta(conta) {
            const container = document.getElementById('accountsContainer');

            // Remover mensagem de vazio se existir
            const empty = container.querySelector('.empty-state');
            if (empty) empty.remove();

            const card = document.createElement('div');
            card.className = 'account-card';
            card.dataset.id = conta.id;

            const urlDisplay = conta.url.length > 50 ? conta.url.substring(0, 50) + '...' : conta.url;

            card.innerHTML = `
                <div class="card-header">
                    <span class="card-name">
                        <i class="fas fa-user-circle" style="color: #ff00ff;"></i>
                        ${conta.nome}
                    </span>
                    <span class="card-id">#${conta.id}</span>
                </div>

                <div class="card-url">
                    <i class="fas fa-link"></i>
                    ${urlDisplay}
                </div>

                <div class="card-status">
                    <span class="dot ${conta.status === 'online' ? 'online' : 'offline'}" id="dot_${conta.id}"></span>
                    <span id="statusText_${conta.id}">${conta.status === 'online' ? '🟢 Conectado' : '🔴 Desconectado'}</span>
                    <span style="margin-left: auto; font-size: 0.6rem; color: #444;">
                        <i class="far fa-clock"></i> ${conta.criadoEm}
                    </span>
                </div>

                <div class="card-buttons">
                    <button class="btn-open" onclick="abrirConta(${conta.id})">
                        <i class="fas fa-external-link-alt"></i> Abrir
                    </button>
                    <button class="btn-popup" onclick="abrirPopup(${conta.id})">
                        <i class="fas fa-window-restore"></i> Popup
                    </button>
                    <button class="btn-remove" onclick="removerConta(${conta.id})" title="Remover">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `;

            container.appendChild(card);

            // Animação de entrada
            card.style.animation = 'none';
            setTimeout(() => {
                card.style.animation = 'fadeIn 0.5s ease';
            }, 10);
        }

        // Abrir conta em nova aba
        function abrirConta(id) {
            const conta = contas.find(c => c.id === id);
            if (!conta) return;

            const win = window.open(conta.url, '_blank');

            if (win) {
                conta.status = 'online';
                conta.janela = win;
                onlineCount++;
                atualizarStatus(id);
                atualizarStats();
                notificar(`🌐 Abrindo: ${conta.nome}`, '#00ff88');

                // Monitorar fechamento
                const check = setInterval(() => {
                    if (win.closed) {
                        clearInterval(check);
                        conta.status = 'offline';
                        conta.janela = null;
                        onlineCount--;
                        atualizarStatus(id);
                        atualizarStats();
                        notificar(`👋 Fechado: ${conta.nome}`, '#ffaa00');
                    }
                }, 1000);
            } else {
                notificar('⚠️ Bloqueado! Permita popups ou use o botão "Popup"', '#ff4444');
            }
        }

        // Abrir conta em popup
        function abrirPopup(id) {
            const conta = contas.find(c => c.id === id);
            if (!conta) return;

            const width = 420;
            const height = 700;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;

            const features =
                `width=${width},height=${height},left=${left},top=${top},menubar=no,toolbar=no,location=yes,status=no,scrollbars=yes,resizable=yes`;

            const popup = window.open(conta.url, `popup_${id}`, features);

            if (popup) {
                conta.status = 'online';
                conta.janela = popup;
                onlineCount++;
                atualizarStatus(id);
                atualizarStats();
                notificar(`📱 Popup: ${conta.nome}`, '#ff00ff');

                const check = setInterval(() => {
                    if (popup.closed) {
                        clearInterval(check);
                        conta.status = 'offline';
                        conta.janela = null;
                        onlineCount--;
                        atualizarStatus(id);
                        atualizarStats();
                        notificar(`👋 Popup fechado: ${conta.nome}`, '#ffaa00');
                    }
                }, 1000);

                popup.focus();
            } else {
                notificar('⚠️ Popup bloqueado! Clique em "Abrir" para nova aba.', '#ff4444');
            }
        }

        // Atualizar status visual
        function atualizarStatus(id) {
            const conta = contas.find(c => c.id === id);
            if (!conta) return;

            const dot = document.getElementById(`dot_${id}`);
            const text = document.getElementById(`statusText_${id}`);

            if (dot && text) {
                dot.className = `dot ${conta.status === 'online' ? 'online' : 'offline'}`;
                text.textContent = conta.status === 'online' ? '🟢 Conectado' : '🔴 Desconectado';
            }
        }

        // Remover conta
        function removerConta(id) {
            const index = contas.findIndex(c => c.id === id);
            if (index === -1) return;

            const conta = contas[index];

            // Fechar janela se estiver aberta
            if (conta.janela && !conta.janela.closed) {
                try {
                    conta.janela.close();
                } catch {}
                onlineCount--;
            }

            const card = document.querySelector(`.account-card[data-id="${id}"]`);
            if (card) {
                card.style.transition = 'all 0.3s ease';
                card.style.transform = 'scale(0.8)';
                card.style.opacity = '0';
                setTimeout(() => {
                    card.remove();
                    contas.splice(index, 1);
                    atualizarStats();

                    // Mostrar mensagem de vazio se não houver contas
                    if (contas.length === 0) {
                        mostrarVazio();
                    }
                }, 300);
            }

            notificar(`🗑️ Removida: ${conta.nome}`, '#ff4444');
        }

        // Criar múltiplas contas
        function criarMultiplas(quantidade) {
            const urls = [
                'https://www.instagram.com',
                'https://www.facebook.com',
                'https://twitter.com',
                'https://www.youtube.com',
                'https://www.tiktok.com',
                'https://www.linkedin.com',
                'https://web.whatsapp.com',
                'https://web.telegram.org',
                'https://www.reddit.com',
                'https://www.pinterest.com'
            ];

            const nomes = [
                'Instagram', 'Facebook', 'Twitter', 'YouTube', 'TikTok',
                'LinkedIn', 'WhatsApp', 'Telegram', 'Reddit', 'Pinterest'
            ];

            for (let i = 0; i < quantidade; i++) {
                const url = urls[Math.floor(Math.random() * urls.length)];
                const nome = nomes[Math.floor(Math.random() * nomes.length)];
                const num = Math.floor(Math.random() * 10000);

                criarConta({
                    nome: `${nome} ${num}`,
                    url: url
                });
            }

            notificar(`📱 ${quantidade} contas criadas!`, '#00ffff');

            // Scroll para o final
            setTimeout(() => {
                const container = document.getElementById('accountsContainer');
                container.scrollTo({
                    top: container.scrollHeight,
                    behavior: 'smooth'
                });
            }, 500);
        }

        // Mostrar estado vazio
        function mostrarVazio() {
            const container = document.getElementById('accountsContainer');
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.innerHTML = `
                <i class="fas fa-mobile-alt"></i>
                <h3>Nenhuma conta ainda</h3>
                <p style="color: #555;">Clique em "Nova" ou "+10" para começar!</p>
            `;
            container.appendChild(empty);
        }

        // ============================================================
        // STATS
        // ============================================================
        function atualizarStats() {
            document.getElementById('totalAccounts').textContent = contas.length;
            document.getElementById('totalOnline').textContent = onlineCount;
        }

        // ============================================================
        // MODAL
        // ============================================================
        function abrirModal() {
            document.getElementById('modal').classList.add('active');
            document.getElementById('nomeConta').focus();
        }

        function fecharModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('formConta').addEventListener('submit', (e) => {
            e.preventDefault();

            const nome = document.getElementById('nomeConta').value.trim();
            const rede = document.getElementById('redeSocial').value;
            const urlPersonalizada = document.getElementById('urlPersonalizada').value.trim();

            if (!nome) {
                notificar('⚠️ Digite um nome para a conta!', '#ffaa00');
                return;
            }

            const url = urlPersonalizada || rede;

            criarConta({ nome, url });

            fecharModal();
            document.getElementById('formConta').reset();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharModal();
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) fecharModal();
        });

        // ============================================================
        // NOTIFICAÇÕES
        // ============================================================
        function notificar(mensagem, cor = '#00ffff') {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.borderColor = cor;
            notif.style.boxShadow = `0 0 40px rgba(0,0,0,0.8), 0 0 30px ${cor}40`;
            notif.innerHTML = mensagem;
            document.body.appendChild(notif);

            setTimeout(() => {
                notif.remove();
            }, 3000);
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        function init() {
            // Criar contas de exemplo
            const exemplos = [
                { nome: '📸 Instagram Pessoal', url: 'https://www.instagram.com' },
                { nome: '👍 Facebook Business', url: 'https://www.facebook.com' },
                { nome: '🐦 Twitter/X News', url: 'https://twitter.com' },
                { nome: '▶️ YouTube Canal', url: 'https://www.youtube.com' },
                { nome: '💼 LinkedIn Profissional', url: 'https://www.linkedin.com' },
                { nome: '🎵 TikTok Criador', url: 'https://www.tiktok.com' }
            ];

            exemplos.forEach(ex => criarConta(ex));

            setTimeout(() => {
                notificar('🚀 Sistema carregado! Clique em "Abrir" para logar', '#00ffff');
            }, 1000);

            setTimeout(() => {
                notificar('💡 Dica: Use "Popup" para janela flutuante', '#ff00ff');
            }, 3000);

            console.log('📱 SocialCell carregado!');
            console.log(`🎯 ${contas.length} contas disponíveis`);
            console.log('💡 Clique em "Abrir" ou "Popup" em cada conta');
        }

        // Iniciar
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
